    head.querySelector("#cW").onchange = e => { location.hash = +e.target.value ? "#/kartlar/" + e.target.value : "#/kartlar"; };
    const stats = h("div", "stats"), area = h("div", "cardarea"); app.append(stats, area);
    const boxes = () => { const b = [0, 0, 0, 0, 0, 0]; list.forEach(c => b[st[c.id] ? st[c.id].box : 0]++); return b; };
    const drawStats = () => { const b = boxes(); stats.innerHTML = `<div><b>Bugün</b> ${list.filter(isDue).length} kart</div><div><b>Yeni</b> ${b[0]}</div>${[1, 2, 3, 4, 5].map(k => `<div><b>Kutu ${k}</b> ${b[k]}</div>`).join("")}<div><b>Kalıcı (kutu 4–5)</b> ${b[4] + b[5]}/${list.length}</div>`; };
    let queue = shuffle(list.filter(isDue));
    function show() {
      drawStats();
      if (!queue.length) {
        area.innerHTML = `<div class="empty"><b>Bugünlük bu destede tekrar edilecek kart kalmadı.</b> Yarın tekrar gel; kartlar zamanı gelince geri döner.</div>`;
        const again = h("button", "", "Yine de hepsini çalış"); again.onclick = () => { queue = shuffle(list); show(); }; area.append(again); return;
      }
      const c = queue[0], box = st[c.id] ? st[c.id].box : 0;
      area.innerHTML = "";
      const card = h("div", "fcard", `<div class="qlabel">${wl(c.week)} · ${box ? "Kutu " + box : "Yeni kart"}<span class="qtype">${queue.length} kart kaldı</span></div><div class="ffront">${c.f}</div><div class="fback hidden">${c.b}${c.s && SECT[c.week][c.s] ? `<div class="where small">📖 <a href="#/hafta/${c.week}/${c.s}">${c.s}. ${SECT[c.week][c.s]}</a></div>` : ""}</div>`);
      const flip = h("button", "primary", "Cevabı göster (boşluk)"), yes = h("button", "primary hidden", "✓ Bildim (1)"), no = h("button", "hidden", "✗ Bilemedim (2)");
      const row = h("div", "btns"); row.append(flip, no, yes); card.append(row); area.append(card);
      const doFlip = () => { card.querySelector(".fback").classList.remove("hidden"); flip.classList.add("hidden"); yes.classList.remove("hidden"); no.classList.remove("hidden"); };
      const answer = good => {
        const cur = st[c.id] || { box: 0 }, nb = good ? Math.min(5, cur.box + 1) : 1;
        st[c.id] = { box: nb, due: t0 + (good ? INTERVAL[nb] : 0) }; cstore.set(st);
        queue.shift(); if (!good) queue.push(c); show();
      };
      flip.onclick = doFlip; yes.onclick = () => answer(true); no.onclick = () => answer(false);
      area.onkey = e => { if (e.key === " " && !flip.classList.contains("hidden")) { e.preventDefault(); doFlip(); } else if (flip.classList.contains("hidden") && (e.key === "1" || e.key === "2")) answer(e.key === "1"); };
    }
    const onKey = e => { if (!document.body.contains(area)) return document.removeEventListener("keydown", onKey); if (e.target.matches && e.target.matches("input, textarea, select")) return; area.onkey && area.onkey(e); };
    document.addEventListener("keydown", onKey);
    show();
    const rs = h("button", "ghost", "Bu destenin kart ilerlemesini sıfırla");
    rs.onclick = () => { if (!confirm("Kart ilerlemesi silinsin mi?")) return; list.forEach(c => delete st[c.id]); cstore.set(st); pageCards(wid); };
    app.append(h("p", "", ""), rs);
  }

  /* ---------- sık karıştırılanlar ve karar ağaçları ---------- */
  function pageCompare() {
    app.innerHTML = "";
    app.append(h("section", "whead", `<h1>Sık karıştırılanlar</h1><p class="muted">Sınavda en çok puan kaybettiren şey, birbirine benzeyen kavramları karıştırmak. Önce karar ağaçlarıyla “hangisini ne zaman” sorusunu çalış, sonra tablolarla farkları pekiştir. Her başlıkta konunun anlatıldığı haftaya bağlantı var.</p>
      <div class="jump"><a href="#" data-j="trees">🧭 Karar ağaçları (${(window.TREES || []).length})</a><a href="#" data-j="tables">⇄ Karşılaştırma tabloları (${(window.COMPARES || []).length})</a></div>`));
    app.querySelectorAll("[data-j]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.j).scrollIntoView({ behavior: "smooth" }); });
    const wk = ids => ids.map(i => `<a class="chip" href="#/hafta/${i}">${wl(i)}</a>`).join(" ");
    const trees = h("section", ""); trees.id = "trees"; trees.append(h("h2", "sec", "🧭 Karar ağaçları: hangisini ne zaman?"));
    (window.TREES || []).forEach(t => {
      const box = h("div", "tree tool"); box.id = "c-" + t.id;
      box.innerHTML = `<h3>${t.t} <span class="small">${wk(t.w)}</span></h3>`;
      const body = h("div", "treebody"); box.append(body); trees.append(box);
      const path = [];
      const draw = node => {
        body.innerHTML = path.map(p => `<div class="tpath"><span class="muted">${p[0]}</span> → <b>${p[1]}</b></div>`).join("");
        if (node.a) {
          body.append(h("div", "tans", node.a));
        } else {
          body.append(h("div", "tq", node.q));
          const row = h("div", "btns"); node.o.forEach(([lab, nx]) => { const b = h("button", "", lab); b.onclick = () => { path.push([node.q, lab]); draw(nx); }; row.append(b); }); body.append(row);
        }
        if (path.length) { const r = h("button", "ghost", "↺ Baştan"); r.onclick = () => { path.length = 0; draw(t.n); }; body.append(r); }
      };
      draw(t.n);
    });
    const tables = h("section", ""); tables.id = "tables"; tables.append(h("h2", "sec", "⇄ Karşılaştırma tabloları"));
    (window.COMPARES || []).forEach(c => {
      const box = h("div", "cmp tool"); box.id = "c-" + c.id;
      box.innerHTML = `<h3>${c.t} <span class="small">${wk(c.w)}</span></h3><div class="tablewrap"><table><tr>${c.h.map(x => `<th>${x}</th>`).join("")}</tr>${c.r.map(r => `<tr>${r.map((x, i) => i ? `<td>${x}</td>` : `<th>${x}</th>`).join("")}</tr>`).join("")}</table></div>${c.tip ? `<div class="tip"><b>Akılda kalsın:</b> ${c.tip}</div>` : ""}`;
      tables.append(box);
    });
    app.append(trees, tables);
  }

  function pageTools() {
    app.innerHTML = ""; app.append(h("section", "whead", `<h1>Etkileşimli Araçlar</h1><p class="muted">Kavramları elle dene. Sürgüleri oynat, noktalar ekle, sonucu gör.</p>`));
    TOOLS.forEach(t => {
      const box = h("section", "tool"); box.append(h("h2", "", `${t.title} <span class="chip">${wl(t.week)}</span>`));
      const inner = h("div", "toolbody"); box.append(inner); app.append(box); t.fn(inner);
    });
  }

  function pageFormulas() {
    app.innerHTML = `<section class="whead"><h1>Formül Kartı</h1><p class="muted">Vizeden önce son bakış. Yazdırmak için tarayıcıdan yazdır (Ctrl+P).</p></section><article class="theory">
<h3>Hafta 2 · Ön işleme</h3>
<table><tr><td>Min-Max</td><td>x' = (x − min) / (max − min) → [0,1]</td></tr>
<tr><td>Z-skor</td><td>z = (x − μ) / σ → ort. 0, std 1</td></tr>
<tr><td>IQR</td><td>IQR = Q3 − Q1; aykırı: &lt; Q1 − 1,5·IQR veya &gt; Q3 + 1,5·IQR</td></tr>
<tr><td>Doldurma</td><td>Sayısal: ortalama (aykırı yoksa) / medyan (aykırı varsa); kategorik: mod</td></tr></table>
<h3>Hafta 3 · Özellik mühendisliği</h3>
<table><tr><td>One-hot</td><td>k kategori → k sütun (drop_first ile k−1) · nominal için</td></tr>
<tr><td>Ordinal kodlama</td><td>Sıralı kategoriler için 0,1,2...</td></tr>
<tr><td>k-fold CV</td><td>Her turda 1 fold test, k−1 fold eğitim; n örnek → fold boyutu n/k</td></tr>
<tr><td>Sıra</td><td>Önce böl → eğitimde fit → eğitim ve teste transform (sızıntıyı önler)</td></tr></table>
<h3>Hafta 4 · Regresyon</h3>
<table><tr><td>Basit regresyon</td><td>ŷ = b0 + b1·x; b1 = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)²; b0 = ȳ − b1·x̄</td></tr>
<tr><td>Çoklu</td><td>ŷ = b0 + b1x1 + ... + bpxp</td></tr>
<tr><td>MAE</td><td>(1/n) Σ |y − ŷ|</td></tr>
<tr><td>MSE</td><td>(1/n) Σ (y − ŷ)²</td></tr>
<tr><td>RMSE</td><td>√MSE (hedefle aynı birim, RMSE ≥ MAE)</td></tr>
<tr><td>R²</td><td>1 − Σ(y−ŷ)² / Σ(y−ȳ)²; 1 en iyi, 0 = ortalama tahmini, negatif olabilir</td></tr>
<tr><td>r ve R²</td><td>r = Σ(x−x̄)(y−ȳ)/√(Σ(x−x̄)²Σ(y−ȳ)²); basit regresyonda R² = r²</td></tr>
<tr><td>Ayarlanmış R²</td><td>1 − (1−R²)(n−1)/(n−p−1)</td></tr>
<tr><td>Gradyan inişi</td><td>b ← b − α·∂MSE/∂b</td></tr></table>
<h3>Hafta 5 · Lojistik regresyon</h3>
<table><tr><td>Model</td><td>z = b0 + b1x1 + ...; P(y=1) = σ(z) = 1 / (1 + e<sup>−z</sup>)</td></tr>
<tr><td>Önemli değerler</td><td>σ(0) = 0,5 · σ(2) ≈ 0,881 · σ(−2) ≈ 0,119</td></tr>
<tr><td>Karar</td><td>P ≥ eşik (0,5) → sınıf 1; karar sınırı z = 0</td></tr>
<tr><td>Odds / logit</td><td>odds = p/(1−p); logit = ln(odds) = z; b kadar logit, e<sup>b</sup> katı odds</td></tr>
<tr><td>Kayıp</td><td>Log-loss (çapraz entropi)</td></tr></table>
<h3>Hafta 6 · kNN</h3>
<table><tr><td>Öklid</td><td>√Σ(xi − yi)²</td></tr>
<tr><td>Manhattan</td><td>Σ|xi − yi|</td></tr>
<tr><td>Minkowski</td><td>(Σ|xi − yi|<sup>r</sup>)<sup>1/r</sup>; r=1 Manhattan, r=2 Öklid</td></tr>
<tr><td>Kosinüs</td><td>(x·y) / (‖x‖‖y‖)</td></tr>
<tr><td>Tahmin</td><td>Sınıflandırma: k komşunun oyu · Regresyon: ortalaması · Ağırlıklı: w = 1/d</td></tr>
<tr><td>k</td><td>Küçük k: aşırı öğrenme · Büyük k: yetersiz öğrenme · İkili problemde tek k · CV ile seç · Ölçekleme şart</td></tr></table>
<h3>Hafta 7 · Değerlendirme</h3>
<table><tr><td>Accuracy</td><td>(TP + TN) / (TP + TN + FP + FN)</td></tr>
<tr><td>Precision</td><td>TP / (TP + FP)</td></tr>
<tr><td>Recall (TPR)</td><td>TP / (TP + FN)</td></tr>
<tr><td>Specificity</td><td>TN / (TN + FP)</td></tr>
<tr><td>FPR</td><td>FP / (FP + TN) = 1 − Specificity</td></tr>
<tr><td>F1</td><td>2PR / (P + R)</td></tr>
<tr><td>ROC / AUC</td><td>x: FPR, y: TPR; AUC 1 = mükemmel, 0,5 = rastgele</td></tr>
<tr><td>Hangisi?</td><td>Kaçırmak pahalı → recall · Yanlış alarm pahalı → precision · Dengesiz veri → accuracy'ye güvenme</td></tr></table>
<h3>Bayes Ağları</h3>
<table><tr><td>Koşullu</td><td>P(A|B) = P(A,B) / P(B) · çarpım: P(A,B) = P(A)P(B|A)</td></tr>
<tr><td>Bayes</td><td>P(A|B) = P(B|A)P(A) / P(B)</td></tr>
<tr><td>Toplam olasılık</td><td>P(B) = P(B|A)P(A) + P(B|¬A)P(¬A)</td></tr>
<tr><td>Zincir kuralı</td><td>P(V1..Vn) = ∏ P(Vi | parents(Vi))</td></tr>
<tr><td>Seri A→B→C</td><td>B bilinirse bloke</td></tr>
<tr><td>Iraksayan A←B→C</td><td>B bilinirse bloke</td></tr>
<tr><td>Yakınsayan A→B←C</td><td>B ve soyu bilinmezse bloke; B veya soyu bilinirse açık</td></tr>
<tr><td>d-ayrışma</td><td>Tüm yollar bloke → d-ayrışmış (koşullu bağımsız); en az bir yol açık → d-bağlantılı</td></tr>
<tr><td>Naive Bayes</td><td>P(C|x) ∝ P(C)·∏P(xi|C)</td></tr></table>
</article>`;
  }

  /* ---------- deneme sınavı ---------- */
  function pageExam() {
    app.innerHTML = "";
    const box = h("section", "whead", `<h1>Deneme Sınavı</h1><p class="muted">Sorular tüm haftalardan rastgele seçilir. Cevapları işaretle, en sonda “Sınavı bitir” de; doğrular ve açıklamalar o zaman görünür.</p>
      <div class="sliders"><label>Soru sayısı <select id="exN"><option>10</option><option selected>20</option><option>30</option><option value="${POOL().length}">Hepsi (${POOL().length})</option></select></label>
      <label>Kapsam <select id="exW"><option value="0">Tüm haftalar</option>${WEEKS.map(w => `<option value="${w.id}">Sadece ${wl(w.id)}</option>`).join("")}</select></label></div>
      <div class="btns"><button class="primary" id="exGo">Sınavı başlat</button></div>`);
    app.append(box);
    box.querySelector("#exGo").onclick = () => {
      const wsel = +box.querySelector("#exW").value, n = +box.querySelector("#exN").value;
      const pool = POOL().filter(q => !wsel || q.week === wsel);
      startExam(shuffle(pool).slice(0, Math.min(n, pool.length)));
    };
  }

  function startExam(qs) {
    app.innerHTML = "";
    app.append(h("section", "whead", `<h1>Deneme Sınavı</h1><p class="muted">${qs.length} soru. Hesaplamalı sorularda virgül veya nokta kullanabilirsin.</p>`));
    const list = h("section", "practice"); const els = [];
    qs.forEach((q, i) => { const e = makeQ(q, { exam: true, label: "Soru " + (i + 1), showWeek: false }); els.push(e); list.append(e); });
    const fin = h("button", "primary big", "Sınavı bitir");
    fin.onclick = () => {
      if (!confirm("Sınavı bitirmek istiyor musun?")) return;
      let right = 0; const per = {};
      const p = store.get();
      els.forEach((e, i) => { const ok = e.api.grade(); const q = qs[i]; per[q.week] = per[q.week] || [0, 0]; per[q.week][1]++; if (ok) { right++; per[q.week][0]++; } p[q.id] = ok ? 1 : 0; e.insertAdjacentHTML("afterbegin", `<span class="chip weekchip">${wl(q.week)}</span>`); });
      store.set(p); fin.remove();
      const pct = Math.round(right / qs.length * 100);
      const res = h("section", "result", `<h2>Sonuç: ${right} / ${qs.length} (%${pct})</h2>
        <p>${pct >= 85 ? "Harika, vizeye hazırsın." : pct >= 60 ? "İyi gidiyorsun, aşağıdaki zayıf haftalara bir daha bak." : "Konu anlatımlarını tekrar oku, sonra yeniden dene."}</p>
        <table><tr><th>Hafta</th><th>Doğru</th><th>Başarı</th><th>Ne yapmalı?</th></tr>${Object.keys(per).sort((a, b) => a - b).map(k => { const pc = Math.round(per[k][0] / per[k][1] * 100), wk = WEEKS.find(x => x.id === +k); return `<tr class="${pc < 70 ? "bad" : ""}"><td><a href="#/hafta/${k}">${wl(+k)}: ${wk.title}</a></td><td>${per[k][0]}/${per[k][1]}</td><td>%${pc}</td><td>${pc < 70 ? `<a href="#/hafta/${k}">Özü ve konuyu oku</a> · <a href="#/yanlislar/${k}">yanlışları çöz</a> · <a href="#/kartlar/${k}">kartlar</a>` : "✓ İyi"}</td></tr>`; }).join("")}</table>
        <p class="muted small">Yanlış yaptığın her sorunun altında, konunun anlatıldığı bölüme giden bir “Konuyu tekrar oku” bağlantısı var (bölümü belli olan sorularda).</p>
        <div class="btns"><a class="btn primary" href="#/sinav">Yeni sınav</a>${right < qs.length ? `<a class="btn" href="#/yanlislar">Yanlışlarımı tekrar çöz (${qs.length - right})</a>` : ""}<a class="btn" href="#/">Ana sayfa</a></div>`);
      refreshNav();
      list.before(res); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    list.append(fin); app.append(list);
  }

  /* ---------- yönlendirme ---------- */
  function route() {
    const hash = location.hash || "#/";
    const m = hash.match(/^#\/hafta\/(\d+)(?:\/(\d+))?/), mw = hash.match(/^#\/yanlislar(?:\/(\d+))?/);
    const mk = hash.match(/^#\/kartlar(?:\/(\d+))?/), mc = hash.match(/^#\/karsilastir(?:\/([\w-]+))?/);
    if (m) pageWeek(+m[1]);
    else if (mw) pageWrong(mw[1] ? +mw[1] : 0);
    else if (mk) pageCards(mk[1] ? +mk[1] : 0);
    else if (mc) pageCompare();
    else if (hash.startsWith("#/araclar")) pageTools();
    else if (hash.startsWith("#/formuller")) { pageFormulas(); glossify(app); }
    else if (hash.startsWith("#/sinav")) pageExam();
    else pageHome();
    refreshNav();
    setActive(m ? "#/hafta/" + m[1] : mw ? "#/yanlislar" : mk ? "#/kartlar" : mc ? "#/karsilastir" : hash.split("?")[0]);
    window.scrollTo(0, 0);
    // bölüm / karşılaştırma bağlantısı: o başlığa kaydır
    const target = m && m[2] ? document.getElementById("s-" + m[2]) : mc && mc[1] ? document.getElementById("c-" + mc[1]) : null;
    if (target) { target.scrollIntoView(); target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1800); }
  }

  function buildNav() {
    nav.innerHTML = `<a href="#/">Ana sayfa</a>` + WEEKS.map(w => `<a href="#/hafta/${w.id}" title="${w.title}">${w.short || "H" + w.id}</a>`).join("") + `<a href="#/kartlar">Kartlar</a><a href="#/karsilastir">Karıştırılanlar</a><a href="#/araclar">Araçlar</a><a href="#/formuller">Formüller</a><a href="#/sinav">Sınav</a><a href="#/yanlislar" id="navWrong">Yanlışlarım</a>`;
  }
  function refreshNav() {
    const a = document.getElementById("navWrong"); if (!a) return;
    const n = wrongCount(0); a.innerHTML = "Yanlışlarım" + (n ? `<span class="nb">${n}</span>` : "");
  }

  /* tema */
  const tbtn = document.getElementById("themeBtn");
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  try { applyTheme(localStorage.getItem("mlvize.theme")); } catch (e) { /* yoksay */ }
  tbtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nxt = cur === "dark" ? "light" : "dark"; applyTheme(nxt);
    try { localStorage.setItem("mlvize.theme", nxt); } catch (e) { /* yoksay */ }
    route();
  };

  buildNav();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
