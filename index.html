<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML Vize Hazırlık</title>
  <meta name="description" content="Makine öğrenmesi vize hazırlık: konu anlatımı, çözümlü örnekler, alıştırmalar, etkileşimli araçlar ve deneme sınavı.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ccircle cx='30' cy='65' r='9' fill='white'/%3E%3Ccircle cx='55' cy='40' r='9' fill='white'/%3E%3Ccircle cx='75' cy='68' r='9' fill='white'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f7f8fa; --surface: #ffffff; --fg: #1b2330; --muted: #5d6b7e; --border: #dfe3ea;
  --accent: #2563eb; --accent-fg: #ffffff; --accent-soft: #e8efff;
  --ok: #15803d; --ok-soft: #e6f6ec; --bad: #b91c1c; --bad-soft: #fdeaea; --warn: #d97706; --warn-soft: #fff5e0;
  --code-bg: #0f172a; --code-fg: #e2e8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #161d28; --fg: #e6ebf2; --muted: #93a1b5; --border: #263041;
    --accent: #6ea0ff; --accent-fg: #0b1220; --accent-soft: #1b2a47;
    --ok: #4ade80; --ok-soft: #12301f; --bad: #f87171; --bad-soft: #3a1717; --warn: #fbbf24; --warn-soft: #3a2c0c;
    --code-bg: #0a0f18; --code-fg: #dbe4f0;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --fg: #e6ebf2; --muted: #93a1b5; --border: #263041;
  --accent: #6ea0ff; --accent-fg: #0b1220; --accent-soft: #1b2a47;
  --ok: #4ade80; --ok-soft: #12301f; --bad: #f87171; --bad-soft: #3a1717; --warn: #fbbf24; --warn-soft: #3a2c0c;
  --code-bg: #0a0f18; --code-fg: #dbe4f0;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 70px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent); }
h1 { font-size: 2rem; line-height: 1.2; margin: .2em 0 .3em; }
h2 { font-size: 1.4rem; margin: 1.4em 0 .5em; }
h3 { font-size: 1.15rem; margin: 1.8em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
h4 { margin: 1.2em 0 .3em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.hidden { display: none; }

/* üst çubuk */
.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.topin { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); text-decoration: none; white-space: nowrap; }
.logo { background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 2px 7px; font-size: .85rem; }
nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { padding: 6px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .92rem; white-space: nowrap; }
nav a:hover { background: var(--accent-soft); color: var(--fg); }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
button, .btn { font: inherit; cursor: pointer; }
.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; }
.ghost:hover { color: var(--fg); border-color: var(--muted); }

/* ana sayfa */
.hero { padding: 36px 0 12px; }
.hero p { font-size: 1.1rem; color: var(--muted); max-width: 60ch; }
.herobtns, .btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.btn, button { border: 1px solid var(--border); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 10px; text-decoration: none; display: inline-block; }
.btn:hover, button:hover:not(:disabled) { border-color: var(--accent); }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.big { padding: 12px 24px; font-size: 1.05rem; margin-top: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-decoration: none; color: var(--fg); display: block; transition: transform .12s, border-color .12s; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card h3 { border: 0; margin: 4px 0; padding: 0; font-size: 1.05rem; }
.card p { margin: 0 0 12px; font-size: .9rem; line-height: 1.45; }
.wk { color: var(--accent); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.howto { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 20px 12px; }
.sec { margin-top: 1.6em; }

/* istatistik kutuları */
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.stats > div { background: var(--accent-soft); border-radius: 8px; padding: 6px 12px; font-size: .92rem; }
.stats b { margin-right: 6px; color: var(--accent); }

/* hafta sayfası */
.whead { padding: 26px 0 6px; }
.jump { display: flex; gap: 10px; margin-top: 12px; }
.jump a { padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; text-decoration: none; background: var(--surface); font-size: .9rem; }
.theory { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px 22px 22px; margin-top: 12px; overflow-wrap: break-word; }
.theory h3:first-child { margin-top: 1em; }
.theory ul, .theory ol { padding-left: 1.3em; }
.theory li { margin: .25em 0; }
.formula { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin: 12px 0; line-height: 1.9; overflow-x: auto; }
.example { background: var(--ok-soft); border-left: 4px solid var(--ok); padding: 12px 16px; border-radius: 6px; margin: 12px 0; line-height: 1.8; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
.warn { background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
code { background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; font-size: .88em; }
pre { background: var(--code-bg); color: var(--code-fg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: .85rem; line-height: 1.55; }
pre code { background: none; padding: 0; color: inherit; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: .93rem; }
th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--accent-soft); }
.theory table { display: block; overflow-x: auto; }
table.cm { width: auto; text-align: center; } table.cm td, table.cm th { text-align: center; min-width: 110px; }
td.good { background: var(--ok-soft); font-weight: 700; } td.bad, tr.bad td { background: var(--bad-soft); }
.tablewrap { overflow-x: auto; }

/* sorular */
.ptop { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.score { color: var(--muted); }
.q { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.q.prev-ok { border-left-color: var(--ok); } .q.prev-bad { border-left-color: var(--bad); }
.q.is-ok { border-color: var(--ok); border-left-color: var(--ok); } .q.is-bad { border-color: var(--bad); border-left-color: var(--bad); }
.qlabel { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 8px; align-items: center; }
.qtype { margin-left: auto; text-transform: none; letter-spacing: 0; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 1px 8px; font-size: .75rem; text-transform: none; letter-spacing: 0; }
.qt { font-weight: 600; margin: 6px 0 10px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 10px 12px; }
.opt .key { background: var(--accent-soft); color: var(--accent); border-radius: 6px; min-width: 24px; text-align: center; font-weight: 700; font-size: .85rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--fg); }
.numrow { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=text], input[type=number], textarea, select { font: inherit; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--fg); }
input[type=text] { flex: 1; min-width: 150px; max-width: 280px; }
.fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: .95rem; }
.is-ok .fb { background: var(--ok-soft); } .is-bad .fb { background: var(--bad-soft); }
.weekchip { float: right; }
.pn { display: flex; justify-content: space-between; margin: 28px 0; }
.result { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 4px 20px 16px; margin: 16px 0; }

/* araçlar */
.tool { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 18px 16px; margin: 18px 0; }
.tool h2 { margin-top: .8em; font-size: 1.15rem; }
canvas { width: 100%; max-width: 560px; height: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; cursor: crosshair; touch-action: manipulation; display: block; }
textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; }
.sliders { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0; align-items: center; }
.sliders label { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.sliders input[type=range] { width: 130px; } .sliders output { min-width: 32px; font-weight: 700; }
.cmin input { width: 90px; }

.foot { padding: 28px 16px 40px; font-size: .85rem; color: var(--muted); }

@media (max-width: 560px) {
  h1 { font-size: 1.6rem; }
  .brand span:not(.logo), .brand { font-size: .95rem; }
  .theory { padding: 4px 14px 16px; }
  .qtype { display: none; }
}
@media print {
  .top, .foot, .btns, .herobtns, .jump, button { display: none !important; }
  body { background: #fff; color: #000; } .theory { border: 0; }
}
tr.open td { background: var(--ok-soft); }
.theory svg text { font-family: inherit; }

/* haftanın özü */
.essence { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 14px; padding: 10px 22px 14px; margin-top: 12px; }
.essence h2 { font-size: 1.05rem; margin: .4em 0 .5em; display: flex; align-items: center; gap: 8px; }
.essence ul { margin: 0; padding-left: 1.2em; }
.essence li { margin: .35em 0; }
.essence .exam { margin-top: 10px; background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: .95rem; }

/* şemalar */
.fig { margin: 18px 0; text-align: center; }
.figsc { overflow-x: auto; padding: 2px 0; }
.fig svg { width: 100%; height: auto; display: block; margin: 0 auto; overflow: visible; }
.fig figcaption { font-size: .86rem; color: var(--muted); margin: 8px auto 0; max-width: 62ch; line-height: 1.45; }
.fig text { fill: var(--fg); font-size: 14px; font-family: inherit; }
.fig .t-sm { font-size: 12px; } .fig .t-b { font-weight: 700; } .fig .t-mu { fill: var(--muted); }
.fig .t-acc { fill: var(--accent); } .fig .t-ok { fill: var(--ok); } .fig .t-bad { fill: var(--bad); } .fig .t-warn { fill: var(--warn); }
.fig .nt { font-weight: 700; font-size: 15px; }
.fig .ax { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.fig .gr { stroke: var(--border); stroke-width: 1; fill: none; }
.fig .frame { stroke: var(--border); fill: none; }
.fig .ln { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .ln2 { stroke: var(--warn); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .lnok { stroke: var(--ok); stroke-width: 2.2; fill: none; }
.fig .dash { stroke-dasharray: 5 4; }
.fig .ar { stroke: var(--muted); stroke-width: 1.8; } .fig .arh { fill: var(--muted); }
.fig .nd { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.fig .nd-b { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2.2; }
.fig .pt { fill: var(--fg); } .fig .pt-a { fill: var(--accent); } .fig .pt-b { fill: var(--warn); } .fig .pt-ok { fill: var(--ok); } .fig .pt-bad { fill: var(--bad); }
.fig .hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 2.4; }
.fig .ring { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 6 4; }
.fig .ring2 { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 6 4; }
.fig .area { fill: var(--accent-soft); }
.fig .bx-mu { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
.fig .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.fig .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
.fig .bx-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
.fig .bx-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
.fig .hl-acc { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 8 4; }
.fig .hl-warn { fill: none; stroke: var(--warn); stroke-width: 2.6; }
.flow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.flow span { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 5px 13px; font-size: .92rem; }
.flow i { color: var(--muted); font-style: normal; font-weight: 700; }

/* bölüm içi araç ve "kendini yokla" */
.theory .tool.embed { background: var(--bg); margin: 20px 0; border-left: 4px solid var(--accent); }
.theory .tool.embed h4 { margin: .9em 0 .2em; }
.check { border: 1px dashed var(--accent); border-radius: 12px; padding: 4px 14px 6px; margin: 20px 0 8px; background: var(--bg); }
.checkh { font-weight: 700; margin: 8px 0 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.check .q { margin: 10px 0; }

/* sezgi, sınavda sık sorulur, klasik sorular */
.intuit { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.teach { border: 1px solid var(--accent); background: var(--surface); border-radius: 12px; padding: 4px 16px 10px; margin: 18px 0; }
.teachh { font-weight: 700; color: var(--accent); margin: 10px 0 4px; }
.classicbox { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--warn); border-radius: 14px; padding: 2px 18px 10px; margin-top: 22px; }
.classicbox > h2 { margin-top: .8em; }
.ctag { background: var(--warn-soft); color: var(--warn); }
.where { margin: -4px 0 8px; color: var(--muted); }
.reread { margin-top: 6px; font-size: .9rem; }
.model { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; line-height: 1.6; }
.q textarea { min-height: 70px; font-family: inherit; }
.selfq { margin-right: 4px; align-self: center; }

/* hafta başı: görünüm seçeneği, bağlantı çipleri */
.viewopts { margin-top: 10px; font-size: .9rem; color: var(--muted); }
.viewopts { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.viewopts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

/* özet kart: tanım → sezgi → formül → örnek */
.concept { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); padding: 4px 14px 8px; margin: 10px 0 14px; }
.conh { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 2px; }
.crow { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--border); align-items: baseline; }
.conh + .crow { border-top: 0; }
.ck { font-size: .74rem; font-weight: 700; border-radius: 6px; padding: 2px 0; text-align: center; }
.ck-t { background: var(--accent-soft); color: var(--accent); } .ck-s { background: var(--warn-soft); color: var(--warn); }
.ck-f { background: var(--bg); color: var(--fg); border: 1px solid var(--border); } .ck-o { background: var(--ok-soft); color: var(--ok); }
.crow .cf { font-weight: 600; overflow-x: auto; }
@media (max-width: 560px) { .crow { grid-template-columns: 1fr; gap: 3px; } .ck { justify-self: start; padding: 2px 8px; } }
.lrow { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
.lchip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 3px 10px; text-decoration: none; }
.lchip:hover { border-color: var(--accent); }

/* adım adım örnek */
.example.stepped .step { padding: 2px 0; }
.example.stepped .step:not(:first-child) { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 6px; }
.stepbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.stepbar button { padding: 5px 12px; font-size: .9rem; }

/* sembol ipuçları */
.sym { font-weight: 700; border-bottom: 1.5px dotted currentColor; cursor: help; outline: none; }
.sym-ok { color: var(--ok); } .sym-bad { color: var(--bad); } .sym-acc { color: var(--accent); } .sym-warn { color: var(--warn); }
.symtip { position: fixed; z-index: 50; max-width: 280px; background: var(--fg); color: var(--bg); font-size: .82rem; line-height: 1.35; padding: 6px 9px; border-radius: 7px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

/* içindekiler + okuma çubuğu */
.readbar { position: fixed; top: 56px; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 11; transition: width .1s; }
.tocbtn { position: fixed; right: 16px; bottom: 16px; z-index: 12; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tocpanel { position: fixed; right: 16px; bottom: 66px; z-index: 12; width: min(320px, calc(100vw - 32px)); max-height: 65vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.tocpanel a { display: block; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: .88rem; line-height: 1.35; }
.tocpanel a:hover { background: var(--accent-soft); }
.tocpanel a.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toch { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 8px; }
.st.ok { color: var(--ok); font-weight: 700; } .st.part { color: var(--warn); font-weight: 700; }
@media (min-width: 1440px) {
  .tocbtn { display: none; }
  .tocpanel { left: calc(50% - 440px - 270px); right: auto; top: 76px; bottom: auto; width: 250px; max-height: calc(100vh - 96px); box-shadow: none; }
}
@media print { .tocbtn, .tocpanel, .readbar { display: none !important; } }
.flash { animation: flash 1.8s ease; }
@keyframes flash { 0%, 40% { background: var(--warn-soft); } 100% { background: transparent; } }

/* kartlar */
.cardarea { margin: 16px 0; }
.fcard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 20px 8px; min-height: 220px; display: flex; flex-direction: column; }
.ffront { font-size: 1.25rem; font-weight: 600; margin: 16px 0; flex: 1; }
.fback { font-size: 1.05rem; background: var(--ok-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.fback .where { margin: 8px 0 0; }

/* karşılaştırma ve karar ağaçları */
.tree h3, .cmp h3 { border: 0; margin: .8em 0 .4em; }
.tq { font-weight: 600; margin: 8px 0 4px; }
.tpath { font-size: .88rem; margin: 2px 0; }
.tans { background: var(--ok-soft); border-left: 4px solid var(--ok); border-radius: 6px; padding: 10px 14px; margin: 10px 0; }
.cmp table th:first-child { white-space: nowrap; }

/* yanlışlarım */
nav a .nb { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-size: .75rem; font-weight: 700; text-align: center; }
.empty { background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; margin: 16px 0; }

<h3>4. Odds ve log-odds (yorumlama)</h3>
<div class="formula">

Yani lojistik regresyon, <b>log-odds'u</b> doğrusal modeller.<br>
Katsayı yorumu: x<sub>j</sub> bir birim artınca log-odds b<sub>j</sub> kadar, <b>odds e<sup>b<sub>j</sub></sup> katı</b> değişir.
</div>
<p>Örnek: p = 0,8 → odds = 0,8/0,2 = 4; log-odds = ln 4 ≈ 1,386. b = 0,7 ise odds'un katı e<sup>0,7</sup> ≈ 2,01 (x bir artınca odds yaklaşık 2 katına çıkar).</p>

<div class="example"><b>Çözümlü örnek:</b> Öğrencinin çalışma saati x ile sınavı geçme olasılığı: z = −4 + 1·x.<br>

  theory: `
<h3>1. Karışıklık matrisi (confusion matrix)</h3>
<p>İkili sınıflandırmada pozitif sınıf = ilgilendiğimiz sınıf (hasta, spam, sahtekârlık).</p>
<table class="cm">
<tr><th></th><th>Tahmin: Pozitif</th><th>Tahmin: Negatif</th></tr>
<tr><th>Gerçek: Pozitif</th><td><b>TP</b> (doğru pozitif)</td><td><b>FN</b> (yanlış negatif)<br><span class="muted">Tip II hata, kaçırma</span></td></tr>
<tr><th>Gerçek: Negatif</th><td><b>FP</b> (yanlış pozitif)<br><span class="muted">Tip I hata, yanlış alarm</span></td><td><b>TN</b> (doğru negatif)</td></tr>
</table>
<div class="tip"><b>Ezber ipucu:</b> İlk harf (T/F) tahminin doğru/yanlış olduğunu, ikinci harf (P/N) <u>tahmin edilen</u> sınıfı söyler. FP = "Pozitif dedik ama yanlış".</div>

<h3>2. Metrikler</h3>
<div class="formula">
<b>Doğruluk (Accuracy)</b> = (TP + TN) / (TP + TN + FP + FN)<br>
<b>Kesinlik (Precision)</b> = TP / (TP + FP) &nbsp; "pozitif dediklerimizin kaçı gerçekten pozitif?"<br>
<b>Duyarlılık (Recall / Sensitivity / TPR)</b> = TP / (TP + FN) &nbsp; "gerçek pozitiflerin kaçını yakaladık?"<br>
<b>Özgüllük (Specificity / TNR)</b> = TN / (TN + FP)<br>
<b>FPR</b> = FP / (FP + TN) = 1 − Specificity<br>
<b>F1</b> = 2·P·R / (P + R) &nbsp; (precision ve recall'un harmonik ortalaması)
</div>
<div class="example"><b>Çözümlü örnek:</b> TP = 40, FN = 10, FP = 5, TN = 45 (toplam 100).<br>
Accuracy = 85/100 = <b>0,85</b><br>
Precision = 40/45 = <b>0,8889</b><br>
Recall = 40/50 = <b>0,80</b><br>
Specificity = 45/50 = <b>0,90</b><br>
F1 = 2·0,8889·0,8 / (0,8889 + 0,8) = <b>0,8421</b></div>

<h3>3. Hangi metrik ne zaman?</h3>
<table>

<h3>1. Temel olasılık</h3>
<ul>
  <li>0 ≤ P(A) ≤ 1; P(¬A) = 1 − P(A).</li>
  <li><b>En çok olabilirlik kestirimi:</b> P(A) = n(A)/n(S) (olayın sayısı / tüm durumlar).</li>
  <li><b>Marjinal</b> P(A), <b>birleşik</b> P(A,B) = P(A∩B), <b>koşullu</b> P(A|B).</li>
</ul>
<div class="formula">
<b>Koşullu olasılık:</b> P(A|B) = P(A,B) / P(B)<br>
<b>Çarpım kuralı:</b> P(A,B) = P(A)·P(B|A) = P(B)·P(A|B)<br>
<b>Bağımsızlık:</b> P(A,B) = P(A)·P(B) ⇔ P(A|B) = P(A)<br>
<b>Birleşim:</b> P(A∪B) = P(A) + P(B) − P(A,B)<br>
<b>Toplam olasılık (marjinalleştirme):</b> P(B) = P(B|A)·P(A) + P(B|¬A)·P(¬A)<br>
<b>Bayes teoremi:</b> P(A|B) = P(B|A)·P(A) / P(B)
</div>
<p>Bayes teoreminde <b>P(A)</b> = önsel (prior), <b>P(B|A)</b> = olabilirlik (likelihood), <b>P(A|B)</b> = sonsal (posterior), <b>P(B)</b> = normalleştirme sabiti.</p>

<h3>6. d-Ayrışma (d-separation)</h3>
<p>İki değişken A ve B, aralarındaki <b>her yol</b> için aşağıdaki koşullardan birini sağlayan bir ara değişken V varsa <b>d-ayrışmıştır</b>:</p>
<ol>
  <li>Bağlantı <b>seri veya ıraksaksa</b> ve V <b>biliniyorsa</b> (örneklenmişse),</li>
  <li>Bağlantı <b>yakınsaksa</b> ve ne V ne de V'nin alt düğümlerinden hiçbiri örneklenmemişse.</li>
</ol>
<p><b>Tüm yollar bloke → d-ayrışmış. En az bir yol açık → d-bağlantılı.</b> Sonuç: d-ayrışmış değişkenler, kanıt verildiğinde <b>koşullu bağımsızdır</b>; kanıt e için P(A | e) = P(A | B, e).</p>
<h4>Çözüm adımları</h4>
<ol>
  <li>A ile B arasındaki tüm yolları bul (oklara <u>her iki yönde</u> gidebilirsin).</li>
  <li>Her yolda ara düğümlerin tipini belirle (seri / ıraksayan / yakınsayan).</li>
  <li>Her ara düğümün (ve yakınsayanlarda alt soyunun) örneklenip örneklenmediğine bak.</li>
  <li>Yoldaki herhangi bir düğüm engelliyorsa yol bloke. Tüm yollar bloke ise d-ayrışmış.</li>
</ol>

<h4>Küçük örnek (slayt): A→B, B→C, A→D, D→C</h4>
<p>Yollar: A-B-C (seri), A-D-C (seri), B-A-D (ıraksayan, A'da), B-C-D (yakınsayan, C'de).</p>

<tr><th>Örneklenen</th><th>Soru</th><th>Sonuç</th><th>Gerekçe</th></tr>
<tr><td>Hiçbiri</td><td>A ve C</td><td>d-bağlantılı</td><td>A-B-C ve A-D-C seri, kanıt yok → açık</td></tr>
<tr><td>Hiçbiri</td><td>B ve D</td><td>d-bağlantılı</td><td>B-A-D ıraksayan, A bilinmiyor → açık</td></tr>
<tr><td>A</td><td>B ve D</td><td><b>d-ayrışmış</b></td><td>B-A-D: A bilindi → bloke. B-C-D: C yakınsayan, kanıt yok → bloke</td></tr>
<tr><td>A, C</td><td>B ve D</td><td>d-bağlantılı</td><td>B-A-D bloke, ama B-C-D: C bilindi → yakınsayan açıldı</td></tr>
<tr><td>B</td><td>A ve C</td><td>d-bağlantılı</td><td>A-B-C bloke, ama A-D-C açık</td></tr>

<h3>6. Veri toplama</h3>
<p>Makine öğrenmesi projesinin ilk adımı doğru ve yeterli veriyi toplamaktır. "Çöp girerse çöp çıkar" (garbage in, garbage out): modelin kalitesi verinin kalitesini aşamaz.</p>

<tr><th>Kaynak</th><th>Örnek</th></tr>
<tr><td>Kurum içi veri tabanları</td><td>Müşteri, satış, öğrenci kayıtları (SQL)</td></tr>

<tr><td>Anket ve gözlem</td><td>Kullanıcı geri bildirimleri</td></tr>
<tr><td>Açık veri setleri</td><td>UCI, Kaggle, TÜİK, Book-Crossing (kNN bölümündeki kitap puanları)</td></tr>

<ul>
  <li><b>Yeterlilik:</b> Yeterli sayıda örnek ve problemi temsil eden özellikler.</li>
  <li><b>Temsil edici (örneklem yanlılığı yok):</b> Veri gerçek kullanım popülasyonunu yansıtmalı. Sadece belli bir gruptan toplanan veri başka gruplarda başarısız olur.</li>

  <li><b>Etiket kalitesi:</b> Denetimli öğrenmede yanlış etiketler modeli bozar.</li>
  <li><b>Etik ve yasal:</b> Kişisel verilerde (KVKK) izin ve anonimleştirme. Ayrımcı yanlılık riski.</li>
  <li><b>Sınıf dengesi:</b> Nadir olayların (dolandırıcılık) yeterince örneği olmalı.</li>
</ul>
<div class="tip"><b>Özet akış:</b> Veri toplama → birleştirme → temizleme → eksik ve aykırı değerleri ele alma → dönüştürme (kodlama, ölçekleme) → eğitim/test ayrımı.</div>

<h3>4. Minkowski mesafesi (genelleme)</h3>
<div class="formula">
d(x, y) = ( Σ<sub>k=1..n</sub> |x<sub>k</sub> − y<sub>k</sub>|<sup>r</sup> )<sup>1/r</sup><br>
r = 1 → Manhattan &nbsp; r = 2 → Öklid &nbsp; r = ∞ → Supremum (en büyük tek fark)<br>
n = iki kişinin de puanladığı grup sayısı
</div>
<p>Angelica–Bill için: r=1 → <b>9</b>, r=2 → <b>4,30</b>, r=3 → <b>3,50</b>, r=∞ → <b>3</b> (en büyük fark: Phoenix). <b>r büyüdükçe tek bir boyuttaki büyük fark toplam uzaklığı daha çok etkiler</b> ve mesafe en büyük farka yaklaşır.</p>

<h3>5. Python'da uygulama (PDF kodları, özet)</h3>

<pre><code>def manhattan(rating1, rating2):
    distance = 0
    for key in rating1:
        if key in rating2:                       # sadece ortak puanlar
            distance += abs(rating1[key] - rating2[key])
    return distance

def computeNearestNeighbor(username, users):
    distances = []
    for user in users:
        if user != username:
            distances.append((manhattan(users[user], users[username]), user))
    distances.sort()                             # en yakın başta
    return distances

    nearest = computeNearestNeighbor(username, users)[0][1]   # en yakın 1 kişi

<h3>6. "Suç kullanıcılarda": not şişmesi (grade inflation)</h3>
<p>Kullanıcılar puan ölçeğini farklı kullanır:</p>

  <li><b>Jordyn</b> her şeyi sever (puanları 4-5).</li>
  <li><b>Hailey</b> "ikili"dir (puanları yalnızca 1 veya 4).</li>
</ul>
<p>Hailey'nin 4'ü, Jordyn'in 4'üyle mi yoksa 5'iyle mi aynı anlama gelir? Mesafe ölçüleri bu farkı hesaba katmaz. Çözüm: <b>Pearson korelasyonu</b>.</p>

<h3>7. Pearson korelasyon katsayısı</h3>
<p>İki kullanıcının puanlarının <u>aynı yönde değişip değişmediğini</u> (eğilim uyumunu) ölçer; ölçek farklarından (not şişmesi) etkilenmez. Değeri <b>−1 ile +1</b> arasındadır: <b>1 tam uyum, −1 tam uyumsuzluk, 0 ilişkisiz</b>. Veriler grafikte düz bir çizgi oluşturuyorsa r = 1 (tam uyum); noktalar çizgiden uzaklaştıkça r düşer (PDF'teki örneklerde 1; 0,91; 0,81).</p>
<div class="formula">
Tanım: r = Σ(x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ) / ( √Σ(x<sub>i</sub> − x̄)² · √Σ(y<sub>i</sub> − ȳ)² )<br><br>
Tek geçişli (algoritmik) form:<br>
r = ( Σxy − (Σx·Σy)/n ) / ( √(Σx² − (Σx)²/n) · √(Σy² − (Σy)²/n) )
</div>
<p>Tek geçişli form tek turda hesaplanır ama <u>sayısal olarak kararsızdır</u> (küçük hata büyüyebilir).</p>
<div class="example"><b>Clara – Robert (not şişmesi örneği):</b><br>
Clara (x) = 4,75; 4,5; 5; 4,25; 4 &nbsp;&nbsp; Robert (y) = 4; 3; 5; 2; 1 &nbsp; (n = 5)<br>
Σxy = 19 + 13,5 + 25 + 8,5 + 4 = <b>70</b>; Σx = <b>22,5</b>; Σy = <b>15</b><br>
Pay: 70 − (22,5·15)/5 = 70 − 67,5 = <b>2,5</b><br>
Σx² = 101,875 → √(101,875 − 22,5²/5) = √(101,875 − 101,25) = √0,625 = <b>0,79057</b><br>
Σy² = 55 → √(55 − 15²/5) = √(55 − 45) = <b>3,16228</b><br>
r = 2,5 / (0,79057 · 3,16228) = 2,5 / 2,5 = <b>1,00</b> → ikisi aynı sıralamayı veriyor; Clara sadece daha yüksek puan veriyor.</div>
<div class="example"><b>Angelica ile diğerleri (yalnızca ortak gruplar):</b><br>
Angelica – Bill: n = 5, pay = 35,25 − 14·14/5 = −3,95, payda 4,369 → r = <b>−0,904</b> (zıt zevkler)<br>
Angelica – Hailey: n = 4 → r = <b>0,420</b><br>
Angelica – Jordyn: n = 6 → r = <b>0,764</b></div>
<pre><code>from math import sqrt
def pearson(rating1, rating2):
    sum_xy = sum_x = sum_y = sum_x2 = sum_y2 = 0
    n = 0
    for key in rating1:
        if key in rating2:
            n += 1
            x = rating1[key]; y = rating2[key]
            sum_xy += x * y; sum_x += x; sum_y += y
            sum_x2 += x**2;  sum_y2 += y**2
    if n == 0: return 0                      # ortak puan yok
    denominator = sqrt(sum_x2 - (sum_x**2) / n) * sqrt(sum_y2 - (sum_y**2) / n)
    if denominator == 0: return 0
    return (sum_xy - (sum_x * sum_y) / n) / denominator</code></pre>

<h3>8. Kosinüs benzerliği</h3>
<div class="formula">
cos(x, y) = (x · y) / ( ‖x‖ × ‖y‖ ) &nbsp; (x·y = noktasal çarpım, ‖x‖ = √Σx<sub>i</sub>² vektör uzunluğu)<br>
Değer: 1 tam benzer, 0 ilişkisiz, −1 tam zıt. <b>Ortak sıfırları (0-0 eşleşmelerini) yok sayar.</b>
</div>
<p><b>Neden gerekli? Seyrek veri (sparse):</b> Bir kişi, milyonlarca şarkıdan (iTunes'ta 15 milyon+) yalnızca birkaç bini çalmıştır; iki kişinin ortak değerlerinin çoğu 0'dır. Metin madenciliğinde de bir kitap, İngilizcedeki bir milyon kelimeden yalnızca birkaç bini içerir. Benzerlik hesabı ortak sıfırlara bağlı olmamalıdır.</p>
<div class="example"><b>Clara – Robert:</b> x·y = 70; ‖x‖ = √101,875 = 10,093; ‖y‖ = √55 = 7,416 → cos = 70 / (10,093 · 7,416) = 70 / 74,85 = <b>0,935</b><br>
<b>Angelica – Veronica</b> (tire = 0): Angelica = (3,5; 2; 0; 4,5; 5; 1,5; 2,5; 2), Veronica = (3; 0; 0; 5; 4; 2,5; 3; 0)<br>
x·y = 10,5 + 0 + 0 + 22,5 + 20 + 3,75 + 7,5 + 0 = <b>64,25</b>; ‖x‖ = √74 = 8,602; ‖y‖ = √65,25 = 8,078<br>
cos = 64,25 / 69,487 = <b>0,9246</b></div>
<div class="example"><b>Çalma sayıları örneği:</b> (Decemberists, Radiohead, Katy Perry): Ann = (10, 5, 32), Ben = (15, 25, 1), Sally = (12, 6, 27).<br>
Sally, Ann'e Ben'den çok daha benzer: Manhattan Ann–Sally = 8, Ann–Ben = 56; kosinüs Ann–Sally = <b>0,992</b>, Ann–Ben = <b>0,310</b>.</div>

<h3>9. Hangi benzerlik ölçüsü kullanılmalı?</h3>
<table>
<tr><th>Veri durumu</th><th>Ölçü</th></tr>
<tr><td>Not şişmesi var (kullanıcılar farklı ölçek kullanıyor)</td><td><b>Pearson</b></td></tr>
<tr><td>Veri <b>yoğun</b> (neredeyse tüm özelliklerin değeri var) ve değerlerin <u>büyüklüğü</u> önemli</td><td><b>Öklid / Manhattan</b></td></tr>
<tr><td>Veri <b>seyrek</b></td><td><b>Kosinüs benzerliği</b></td></tr>
</table>

<h4>Seyrek veride Manhattan/Öklid neden yanıltır? (Linda, Eric, Jake)</h4>
<ul>
  <li>Linda ve Eric aynı müziği (60'lar rock) seviyor; <b>20 ortak şarkı</b>, ortalama puan farkı 0,5. Manhattan = 20 × 0,5 = <b>10</b>; Öklid = √(0,5² × 20) = √5 = <b>2,236</b>.</li>
  <li>Linda ile Jake'in (country hayranı) <b>tek ortak şarkısı</b> var: Linda 3, Jake 5 verdi. Manhattan = <b>2</b>; Öklid = √(3−5)² = <b>2</b>.</li>
  <li>Mesafeler Jake'i Linda'ya <u>daha yakın</u> gösteriyor, oysa sağduyuya göre Eric daha yakın. Yani seyrek veride her iki mesafe de kötü sonuç verir.</li>
</ul>
<h4>"Boşlukları 0 yapalım" neden işe yaramaz? (Jake, Cooper, Kelsey)</h4>
<p>Puanlanmayan şarkılara 0 verilirse (10 şarkılık basit örnek):</p>
<table>
<tr><th>Şarkı</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td>Jake</td><td>0</td><td>0</td><td>0</td><td>4,5</td><td>5</td><td>4,5</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>Cooper</td><td>0</td><td>0</td><td>4</td><td>5</td><td>5</td><td>5</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>Kelsey</td><td>5</td><td>4</td><td>4</td><td>5</td><td>5</td><td>5</td><td>5</td><td>5</td><td>4</td><td>4</td></tr>
</table>
<p>Sıfırlı Manhattan: d(Cooper, Jake) = 4 + 0,5 + 0 + 0,5 = <b>5</b>; d(Kelsey, Jake) = <b>32</b>. Oysa yalnızca <u>ortak puanlanan şarkılara</u> (4, 5, 6) bakınca ikisi de Jake'e <b>eşit uzaklıkta</b> (her ikisi için 1). Sıfırlar mesafeye baskın gelir; sıfır doldurma çözüm değildir. Geçici çözüm: mesafeyi ortak şarkı sayısına bölüp "ortalama uzaklık" kullanmak (1/3 = 0,333). Asıl öneri: veri seyrekse kosinüs.</p>

<h3>10. Tuhaflıklar ve k-En Yakın Komşu ile öneri</h3>
<p><b>Sorun:</b> Tek "en benzer" kişiye dayanırsak, onun tuhaflıkları öneriye taşınır (Bob, babası polka grubunda akordeon çaldığı için Walter Ostanek Band'e 5 yıldız vermiş; Amy'ye bu grup önerilir). <b>Çözüm:</b> önerileri birden fazla benzer kişiye dayandırmak: <b>k-NN</b>. k uygulamaya özgüdür, denenerek bulunur.</p>
<div class="formula">
<b>Etki Pastası:</b> komşu i'nin payı = Pearson<sub>i</sub> / (seçilen k komşunun Pearson toplamı)<br>
<b>Tahmin puanı</b> = Σ (komşunun puanı × payı)
</div>
<div class="example"><b>Ann için The Grey Wardens tahmini</b> (Pearson: Sally 0,8; Eric 0,7; Amanda 0,5. Puanlar: Sally 3,5; Eric 5; Amanda 4,5)<br>
<b>k = 3:</b> toplam = 2,0 → paylar Sally %40, Eric %35, Amanda %25<br>
Tahmin = 3,5·0,40 + 5·0,35 + 4,5·0,25 = 1,4 + 1,75 + 1,125 = <b>4,275</b><br>
<b>k = 2:</b> en yakın ikisi Sally ve Eric, toplam 1,5 → paylar 0,8/1,5 = 0,5333 ve 0,7/1,5 = 0,4667<br>
Tahmin = 3,5·0,5333 + 5·0,4667 = 1,867 + 2,333 = <b>4,2</b></div>
<p>PDF'teki <code>recommender</code> sınıfı: <code>recommender(data, k=1, metric='pearson', n=5)</code>. <code>computeNearestNeighbor</code> Pearson değerine göre <b>büyükten küçüğe</b> sıralar (Pearson'da büyük = benzer). <code>recommend</code> k komşunun toplam Pearson'ına göre ağırlıklandırıp (<code>weight = nearest[i][1] / totalDistance</code>) komşuların puanladığı ama kullanıcının puanlamadığı ürünlerin puanlarını ağırlıklı toplar, en yüksek n öneriyi döndürür. Örnek çıktılar (k=1, Pearson):</p>
<pre><code>>>> r = recommender(users)

<h3>9. Naive Bayes (Kategorik sayfası)</h3>

<div class="formula">
<b>Önsel:</b> P(C=c) = n<sub>c</sub> / N<br>
<b>Koşullu (Laplace düzeltmeli):</b> P(X<sub>j</sub>=v | C=c) = (n<sub>jvc</sub> + 1) / (n<sub>c</sub> + m) &nbsp; (m = özelliğin değer sayısı = 2)<br>
<b>Ham skor:</b> S(c) = P(C=c) · ∏ⱼ P(X<sub>j</sub>=x<sub>j</sub> | C=c)<br>
<b>Normalize:</b> P(C=c | x) = S(c) / Σ<sub>r</sub> S(r) &nbsp;&nbsp; <b>Karar:</b> en büyük posterior
</div>

<tr><th>Sınıf</th><th>n</th><th>Önsel</th><th>P(A=Düşük|c)</th><th>P(B=Düşük|c)</th><th>P(C=Yüksek|c)</th><th>P(D=Yüksek|c)</th><th>P(E=Düşük|c)</th></tr>

<tr><td>Kaldı</td><td>152</td><td>0,5067</td><td>(116+1)/154 = 0,7597</td><td>(86+1)/154 = 0,5649</td><td>(47+1)/154 = 0,3117</td><td>(51+1)/154 = 0,3377</td><td>(104+1)/154 = 0,6818</td></tr>
</table>
<div class="example">
S(Geçti) = 0,4933 × 0,26 × 0,38 × 0,6667 × 0,6667 × 0,3333 = <b>0,007221</b><br>
S(Kaldı) = 0,5067 × 0,7597 × 0,5649 × 0,3117 × 0,3377 × 0,6818 = <b>0,015605</b><br>
P(Kaldı | x) = 0,015605 / (0,007221 + 0,015605) = <b>0,6836 (%68,36)</b>; P(Geçti | x) = <b>%31,64</b> → tahmin <b>Kaldı</b>
</div>
<ul>
  <li><b>Önsel olasılıkların toplamı 1</b> olmalı: 0,4933 + 0,5067.</li>
  <li><b>Laplace neden?</b> Eğitimde hiç görülmeyen bir değer kombinasyonu olasılığı 0 yapar ve çarpımın tamamını sıfırlar. +1 (payda +m) bunu önler. Burada m = 2, çünkü her özellik 2 değer alır (Düşük, Yüksek).</li>
  <li>Laplace'sız (n/n<sub>c</sub>) hesapla da benzer: Kaldı %68,62; Geçti %31,38.</li>
  <li><b>Ham skorlar yüzde değildir</b> (toplamları 1 değil, çok küçük sayıların çarpımı); karşılaştırmak için normalize edilir.</li>
  <li><b>Bağımsızlık varsayımı:</b> Özellikler sınıf verildiğinde birbirinden bağımsız kabul edilir; gerçekte güçlü bir varsayımdır. İlişkili özellikler aynı kanıtı birden çok kez sayar.</li>
  <li><b>Veri tipi tuzağı (Kategorik!E303):</b> Test satırının E değeri sayısal 67 kalmış; oysa Naive Bayes girdisi Düşük/Yüksek olmalı. Sayısal 67, kategorik değer eşleşmesini bozar; <b>Düşük'e dönüştürülmelidir</b>.</li>
  <li>kNN ve Naive Bayes farkı: kNN <u>mesafe</u> kullanır, tembeldir, sayısal özellik ister. Naive Bayes <u>olasılık</u> kullanır, hızlıdır, kategorik veriyle doğal çalışır.</li>
</ul>

/* ===== tools.js ===== */
/* Etkileşimli araçlar */
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const fmt = (v, d = 4) => (Number.isFinite(v) ? String(+v.toFixed(d)).replace(".", ",") : "—");
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function percentile(sorted, p) {
    const idx = (sorted.length - 1) * p;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  }

  /* 1) Ön işleme aracı */
  function toolPrep(box) {
    box.innerHTML = `
      <p class="muted">Sayıları virgül veya boşlukla ayırarak yaz (ondalık için nokta kullan: 2.5). Min-Max, Z-skor ve IQR aykırı değer analizini görürsün. (Standart sapma: popülasyon, yani StandardScaler gibi n'e bölünür.)</p>
      <textarea id="prepIn" rows="2">10, 12, 14, 15, 18, 20, 22, 95</textarea>
      <div id="prepOut"></div>`;
    const ta = $("#prepIn", box), out = $("#prepOut", box);
    function run() {
      const xs = ta.value.split(/[\s;,]+/).map(parseFloat).filter(Number.isFinite);
      if (xs.length < 2) { out.innerHTML = "<p class='muted'>En az 2 sayı gir.</p>"; return; }
      const n = xs.length, mean = xs.reduce((a, b) => a + b, 0) / n;
      const sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
      const s = [...xs].sort((a, b) => a - b);
      const mn = s[0], mx = s[n - 1];
      const q1 = percentile(s, .25), q3 = percentile(s, .75), med = percentile(s, .5), iqr = q3 - q1;
      const lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
      let rows = xs.map(x => {
        const z = sd ? (x - mean) / sd : 0, out = x < lo || x > hi;
        return `<tr class="${out ? "bad" : ""}"><td>${fmt(x)}</td><td>${mx > mn ? fmt((x - mn) / (mx - mn)) : "—"}</td><td>${fmt(z)}</td><td>${out ? "Aykırı" : ""}</td></tr>`;
      }).join("");
      out.innerHTML = `
        <div class="stats">
          <div><b>n</b> ${n}</div><div><b>Ortalama</b> ${fmt(mean)}</div><div><b>Medyan</b> ${fmt(med)}</div>
          <div><b>Std (σ)</b> ${fmt(sd)}</div><div><b>Min</b> ${fmt(mn)}</div><div><b>Max</b> ${fmt(mx)}</div>
          <div><b>Q1</b> ${fmt(q1)}</div><div><b>Q3</b> ${fmt(q3)}</div><div><b>IQR</b> ${fmt(iqr)}</div>
          <div><b>Alt sınır</b> ${fmt(lo)}</div><div><b>Üst sınır</b> ${fmt(hi)}</div>
        </div>
        <div class="tablewrap"><table><tr><th>x</th><th>Min-Max</th><th>Z-skor</th><th>IQR</th></tr>${rows}</table></div>
        <p class="muted">Not: Ortalama (${fmt(mean, 2)}) ile medyanı (${fmt(med, 2)}) karşılaştır; aykırı değer ortalamayı çeker, medyanı çekmez.</p>`;
    }
    ta.addEventListener("input", run); run();
  }

  /* 2) Regresyon tuvali */
  function toolReg(box) {
    box.innerHTML = `
      <p class="muted">Tuvale tıklayarak nokta ekle. Doğru ve hata ölçütleri anında güncellenir. Uzağa bir nokta ekleyip doğrunun nasıl kaydığını gör.</p>
      <canvas id="regC" width="560" height="360"></canvas>
      <div class="btns"><button id="regEx">Örnek veri</button><button id="regOut">Aykırı değer ekle</button><button id="regClr">Temizle</button></div>
      <div id="regRes" class="stats"></div>`;
    const c = $("#regC", box), g = c.getContext("2d");
    let pts = [[1, 2], [2, 4], [3, 5], [4, 4], [5, 5]];
    const W = c.width, H = c.height, P = 34, X = v => P + v / 10 * (W - 2 * P), Y = v => H - P - v / 10 * (H - 2 * P);
    function fit() {
      const n = pts.length; if (n < 2) return null;
      const mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
      let sxy = 0, sxx = 0; pts.forEach(p => { sxy += (p[0] - mx) * (p[1] - my); sxx += (p[0] - mx) ** 2; });
      if (sxx === 0) return null;
      const b1 = sxy / sxx, b0 = my - b1 * mx;
      let ae = 0, se = 0, sst = 0;
      pts.forEach(p => { const e = p[1] - (b0 + b1 * p[0]); ae += Math.abs(e); se += e * e; sst += (p[1] - my) ** 2; });
      return { b0, b1, mae: ae / n, mse: se / n, rmse: Math.sqrt(se / n), r2: sst ? 1 - se / sst : NaN };
    }
    function draw() {
      g.clearRect(0, 0, W, H);
      g.strokeStyle = css("--border"); g.fillStyle = css("--muted"); g.font = "12px sans-serif"; g.lineWidth = 1;
      for (let i = 0; i <= 10; i += 2) {
        g.beginPath(); g.moveTo(X(i), Y(0)); g.lineTo(X(i), Y(10)); g.moveTo(X(0), Y(i)); g.lineTo(X(10), Y(i)); g.stroke();
        g.fillText(i, X(i) - 3, H - 14); g.fillText(i, 10, Y(i) + 4);
      }
      const f = fit();
      if (f) {
        g.strokeStyle = css("--warn"); g.lineWidth = 1;
        pts.forEach(p => { g.beginPath(); g.moveTo(X(p[0]), Y(p[1])); g.lineTo(X(p[0]), Y(f.b0 + f.b1 * p[0])); g.stroke(); });
        g.strokeStyle = css("--accent"); g.lineWidth = 2.5; g.beginPath(); g.moveTo(X(0), Y(f.b0)); g.lineTo(X(10), Y(f.b0 + f.b1 * 10)); g.stroke();
      }
      g.fillStyle = css("--fg");
      pts.forEach(p => { g.beginPath(); g.arc(X(p[0]), Y(p[1]), 5, 0, 7); g.fill(); });
      const r = $("#regRes", box);
      r.innerHTML = f ? `<div><b>ŷ</b> = ${fmt(f.b0, 3)} ${f.b1 < 0 ? "−" : "+"} ${fmt(Math.abs(f.b1), 3)}·x</div><div><b>MAE</b> ${fmt(f.mae, 3)}</div><div><b>MSE</b> ${fmt(f.mse, 3)}</div><div><b>RMSE</b> ${fmt(f.rmse, 3)}</div><div><b>R²</b> ${fmt(f.r2, 3)}</div><div><b>n</b> ${pts.length}</div>` : "<div>En az 2 farklı x'li nokta gerekli</div>";
    }
    c.addEventListener("click", e => {
      const r = c.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
      pts.push([Math.max(0, Math.min(10, (px - P) / (W - 2 * P) * 10)), Math.max(0, Math.min(10, (H - P - py) / (H - 2 * P) * 10))]); draw();
    });
    $("#regEx", box).onclick = () => { pts = [[1, 2], [2, 4], [3, 5], [4, 4], [5, 5]]; draw(); };
    $("#regOut", box).onclick = () => { pts.push([9, 1]); draw(); };
    $("#regClr", box).onclick = () => { pts = []; draw(); };
    draw();
  }

  /* 3) Sigmoid */
  function toolSig(box) {
    box.innerHTML = `
      <p class="muted">z = b0 + b1·x ve P = σ(z) = 1/(1+e^−z). Sürgüleri oynat.</p>
      <div class="sliders">
        <label>b0 <input id="sb0" type="range" min="-10" max="10" step="0.5" value="-4"><output id="ob0">-4</output></label>
        <label>b1 <input id="sb1" type="range" min="-3" max="3" step="0.1" value="1"><output id="ob1">1</output></label>
        <label>x <input id="sx" type="range" min="0" max="12" step="0.5" value="6"><output id="ox">6</output></label>
        <label>Eşik <input id="st" type="range" min="0.05" max="0.95" step="0.05" value="0.5"><output id="ot">0.5</output></label>
      </div>
      <canvas id="sigC" width="560" height="300"></canvas>
      <div id="sigRes" class="stats"></div>`;
    const c = $("#sigC", box), g = c.getContext("2d"), W = c.width, H = c.height, P = 34;
    const sg = z => 1 / (1 + Math.exp(-z));
    function run() {
      const b0 = +$("#sb0", box).value, b1 = +$("#sb1", box).value, x = +$("#sx", box).value, th = +$("#st", box).value;
      $("#ob0", box).textContent = b0; $("#ob1", box).textContent = b1; $("#ox", box).textContent = x; $("#ot", box).textContent = th;
      const X = v => P + v / 12 * (W - 2 * P), Y = p => H - P - p * (H - 2 * P);
      g.clearRect(0, 0, W, H); g.strokeStyle = css("--border"); g.fillStyle = css("--muted"); g.font = "12px sans-serif"; g.lineWidth = 1;
      for (let i = 0; i <= 12; i += 2) { g.beginPath(); g.moveTo(X(i), Y(0)); g.lineTo(X(i), Y(1)); g.stroke(); g.fillText(i, X(i) - 3, H - 14); }
      [0, .5, 1].forEach(p => { g.beginPath(); g.moveTo(X(0), Y(p)); g.lineTo(X(12), Y(p)); g.stroke(); g.fillText(p, 8, Y(p) + 4); });
      g.setLineDash([5, 4]); g.strokeStyle = css("--warn"); g.beginPath(); g.moveTo(X(0), Y(th)); g.lineTo(X(12), Y(th)); g.stroke(); g.setLineDash([]);
      g.strokeStyle = css("--accent"); g.lineWidth = 2.5; g.beginPath();
      for (let i = 0; i <= 240; i++) { const xx = i / 20; const px = X(xx), py = Y(sg(b0 + b1 * xx)); i ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke();
      const z = b0 + b1 * x, p = sg(z);
      g.fillStyle = css("--fg"); g.beginPath(); g.arc(X(x), Y(p), 6, 0, 7); g.fill();
      $("#sigRes", box).innerHTML = `<div><b>z</b> ${fmt(z, 3)}</div><div><b>P(y=1)</b> ${fmt(p, 4)}</div><div><b>odds</b> ${fmt(p / (1 - p), 3)}</div><div><b>Tahmin</b> sınıf ${p >= th ? 1 : 0}</div><div><b>Karar sınırı</b> x = ${b1 ? fmt((Math.log(th / (1 - th)) - b0) / b1, 2) : "—"}</div>`;
    }

  }

  /* 4) kNN oyun alanı */
  function toolKnn(box) {
    box.innerHTML = `
      <p class="muted">Mavi ve turuncu sınıflar. Tuvale tıkla: seçili moda göre <b>sorgu noktası</b> koy veya yeni <b>eğitim noktası</b> ekle. k'yı ve mesafe türünü değiştir.</p>

        <label>Tıklama <select id="kmode"><option value="q">Sorgu noktası koy</option><option value="a">Mavi nokta ekle</option><option value="b">Turuncu nokta ekle</option></select></label>

    const c = $("#knnC", box), g = c.getContext("2d"), W = c.width, H = c.height, P = 24;
    const X = v => P + v / 10 * (W - 2 * P), Y = v => H - P - v / 10 * (H - 2 * P);

    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let pts, q = null;
    function reset() {
      seed = 7; pts = [];
      for (let i = 0; i < 14; i++) { pts.push({ x: 3 + (rnd() - .5) * 4, y: 3.2 + (rnd() - .5) * 4, c: "A" }); pts.push({ x: 6.8 + (rnd() - .5) * 4, y: 6.4 + (rnd() - .5) * 4, c: "B" }); }
      pts.forEach(p => { p.x = Math.max(.3, Math.min(9.7, p.x)); p.y = Math.max(.3, Math.min(9.7, p.y)); });

      g.clearRect(0, 0, W, H); g.strokeStyle = css("--border"); g.lineWidth = 1;

      let res = "";
      if (q) {
        const d = pts.map(p => ({ p, d: met === "e" ? Math.hypot(p.x - q.x, p.y - q.y) : Math.abs(p.x - q.x) + Math.abs(p.y - q.y) })).sort((a, b) => a.d - b.d);

    $("#knnRst", box).onclick = () => { reset(); run(); };
    reset(); run();
  }

  /* 5) Karışıklık matrisi hesaplayıcı */
  function toolCm(box) {
    box.innerHTML = `
      <p class="muted">TP, FP, FN, TN değerlerini gir; tüm metrikler hesaplanır.</p>

    function run() {
      const v = id => Math.max(0, +$("#" + id, box).value || 0), TP = v("cTP"), FN = v("cFN"), FP = v("cFP"), TN = v("cTN");
      const N = TP + FN + FP + TN, acc = (TP + TN) / N, pr = TP / (TP + FP), rc = TP / (TP + FN), sp = TN / (TN + FP), f1 = 2 * pr * rc / (pr + rc), fpr = FP / (FP + TN);

  /* 7) d-ayrışma denetleyicisi (A-M referans ağı) */
  function toolDsep(box) {
    const E = [["A", "D"], ["B", "D"], ["B", "E"], ["C", "E"], ["C", "F"], ["D", "H"], ["E", "I"], ["F", "J"], ["G", "J"], ["H", "K"], ["I", "K"], ["I", "L"], ["J", "L"], ["K", "M"]];
    const N = "ABCDEFGHIJKLM".split("");
    const par = n => E.filter(e => e[1] === n).map(e => e[0]), chi = n => E.filter(e => e[0] === n).map(e => e[1]);
    function desc(n) { const s = new Set(), st = [n]; while (st.length) { const x = st.pop(); chi(x).forEach(c => { if (!s.has(c)) { s.add(c); st.push(c); } }); } return s; }
    // yolları bul (yönsüz basit yollar) ve her biri için bloke durumunu hesapla
    function paths(x, y) {
      const res = [];
      (function dfs(path) {
        const last = path[path.length - 1];
        if (last === y) { res.push(path.slice()); return; }
        const nb = new Set([...par(last), ...chi(last)]);
        nb.forEach(n => { if (!path.includes(n)) { path.push(n); dfs(path); path.pop(); } });
      })([x]);
      return res;
    }
    function analyze(path, Z) {
      for (let i = 1; i < path.length - 1; i++) {
        const a = path[i - 1], v = path[i], b = path[i + 1];
        const collider = E.some(e => e[0] === a && e[1] === v) && E.some(e => e[0] === b && e[1] === v);
        if (collider) {
          const open = Z.has(v) || [...desc(v)].some(d => Z.has(d));
          if (!open) return { blocked: true, why: `${v} yakınsayan ve ${v} ile alt düğümleri bilinmiyor` };
        } else if (Z.has(v)) {
          const serial = E.some(e => e[0] === a && e[1] === v) && E.some(e => e[0] === v && e[1] === b) || E.some(e => e[0] === b && e[1] === v) && E.some(e => e[0] === v && e[1] === a);
          return { blocked: true, why: `${v} ${serial ? "seri" : "ıraksayan"} ve bilinen düğüm` };
        }
      }
      return { blocked: false, why: "tüm düğümler geçişe izin veriyor" };
    }
    const opts = N.map(n => `<option>${n}</option>`).join("");
    box.innerHTML = `
      <p class="muted">Referans ağ (Bayes Ağları bölümündeki şekil): A→D, B→D, B→E, C→E, C→F, D→H, E→I, F→J, G→J, H→K, I→K, I→L, J→L, K→M. İki düğüm seç, bilinen (örneklenen) düğümleri işaretle.</p>
      <div class="sliders"><label>Düğüm 1 <select id="dX">${opts}</select></label><label>Düğüm 2 <select id="dY">${opts}</select></label></div>
      <div class="sliders" id="dZ">${N.map(n => `<label><input type="checkbox" value="${n}"> ${n}</label>`).join("")}</div>
      <div id="dsepRes"></div>`;
    $("#dY", box).value = "F";
    function run() {
      const x = $("#dX", box).value, y = $("#dY", box).value;
      const Z = new Set([...box.querySelectorAll("#dZ input:checked")].map(i => i.value)); Z.delete(x); Z.delete(y);
      const out = $("#dsepRes", box);
      if (x === y) { out.innerHTML = "<p class='muted'>İki farklı düğüm seç.</p>"; return; }
      const ps = paths(x, y).map(p => ({ p, r: analyze(p, Z) }));
      const sep = ps.every(o => o.r.blocked);
      const pathStr = p => p.map((n, i) => i === 0 ? n : (E.some(e => e[0] === p[i - 1] && e[1] === n) ? " → " : " ← ") + n).join("");
      out.innerHTML = `<div class="stats"><div><b>${x} ve ${y}</b> | {${[...Z].join(", ") || "∅"}}</div><div><b>Sonuç</b> ${sep ? "d-AYRIŞMIŞ" : "d-BAĞLANTILI"}</div><div><b>Yol sayısı</b> ${ps.length}</div></div>
      <div class="tablewrap"><table><tr><th>Yol</th><th>Durum</th><th>Neden</th></tr>${ps.map(o => `<tr class="${o.r.blocked ? "" : "open"}"><td>${pathStr(o.p)}</td><td>${o.r.blocked ? "Bloke" : "<b>AÇIK</b>"}</td><td>${o.r.why}</td></tr>`).join("")}</table></div>`;
    }
    box.querySelectorAll("select,input").forEach(i => i.addEventListener("input", run)); run();
  }

  window.TOOLS = [

  /* ---------- 3) Naive Bayes (Kategorik) ---------- */
  function toolNb(box) {

<ul>

<p><b>Yanlılık–varyans dengesi (bias–variance trade-off):</b> <b>Yanlılık</b>, modelin fazla basit olmasından gelen sistematik hatadır → yetersiz öğrenme. <b>Varyans</b>, modelin eğitim verisindeki küçük değişikliklere aşırı duyarlı olmasıdır → aşırı öğrenme. Model karmaşıklaştıkça yanlılık azalır, varyans artar. Amaç, toplam test hatasının en küçük olduğu orta noktayı bulmaktır (ör. kNN'de uygun k).</p>

      { t: "num", s: 3, q: "Veri: 2, 4, 5, 7, 8, 9, 11, 40. Q1 = 4,75 ve Q3 = 9,5'tir. IQR yöntemine göre ÜST sınır kaçtır? (3 ondalık)", a: 16.625, tol: 0.002, e: "IQR = 9,5 − 4,75 = 4,75; üst sınır = 9,5 + 1,5·4,75 = 16,625." },
      { t: "mcp", s: 3, q: "Aynı veride (üst sınır 16,625; alt sınır −2,375) hangi değer aykırıdır?", o: ["40", "11", "2", "Hiçbiri"], a: 0, e: "Yalnızca 40, üst sınırın üzerinde." },
      { t: "mcp", s: 1, q: "'Müşteri memnuniyeti: 1–5 yıldız' değişkeni hangi veri tipidir?", o: ["Ordinal (sıralı kategorik)", "Nominal", "Sürekli", "Oran ölçeği"], a: 0, e: "Kategoriler arasında doğal bir sıra var ama yıldızlar arası farkın eşit olduğu garanti değil: ordinal." }
    ],
    3: [
      O(3, "Özellik seçimi ile özellik çıkarımı arasındaki fark nedir? Birer örnek veriniz.", "<b>Seçim:</b> mevcut özelliklerden en faydalı olanları tutar, yeni özellik üretmez (korelasyonla filtreleme, RFE, Lasso). <b>Çıkarım:</b> mevcut özelliklerden yeni (dönüştürülmüş) özellikler türetir, genelde boyut azaltmak için (PCA)."),
      O(2, "Filtre, sarmalayıcı (wrapper) ve gömülü (embedded) özellik seçim yöntemlerini karşılaştırınız.", "<b>Filtre:</b> modelden bağımsız, istatistiksel skorla seçer (korelasyon, ki-kare, varyans eşiği); hızlıdır. <b>Sarmalayıcı:</b> farklı özellik altkümelerini model üzerinde dener (ileri seçim, geri eleme, RFE); yavaştır ama genelde daha iyidir. <b>Gömülü:</b> seçim model eğitimi sırasında olur (Lasso / L1, ağaçların özellik önemi)."),
      O(4, "One-hot kodlama nedir? Nominal bir değişkene neden 0, 1, 2 gibi etiket kodlaması uygulanmaz?", "Her kategori için ayrı bir 0/1 sütunu oluşturmaktır (Renk → Renk_Kırmızı, Renk_Mavi, Renk_Yeşil). Nominal değişkene 0, 1, 2 verilirse model kategoriler arasında olmayan bir <b>sıralama ve mesafe</b> öğrenir (Yeşil > Mavi > Kırmızı). Sıralı (ordinal) değişkenlerde ise 0, 1, 2 kodlaması uygundur. k kategori için drop_first ile k−1 sütun yeterlidir (dummy tuzağı)."),
      O(5, "Veri neden eğitim, doğrulama ve test kümelerine ayrılır?", "<b>Eğitim</b> kümesinde model parametrelerini öğrenir. <b>Doğrulama</b> kümesiyle hiperparametre ayarı ve model seçimi yapılır. <b>Test</b> kümesi, modelin hiç görmediği veride nihai başarısını ölçmek için en sonda bir kez kullanılır. Ayırmazsak, ezberleyen model de yüksek skor alır ve başarı olduğundan iyi görünür."),
      O(6, "k-katlı çapraz doğrulamayı açıklayınız. Avantaj ve dezavantajı nedir?", "Veri k eşit parçaya bölünür; her turda 1 parça test, kalan k−1 parça eğitim olur; k tur sonunda skorların ortalaması alınır. <b>Avantaj:</b> sonuç tek bir rastgele bölmenin şansına bağlı kalmaz, her örnek hem eğitimde hem testte kullanılır, küçük veride güvenilir tahmin verir. <b>Dezavantaj:</b> model k kez eğitilir (maliyet)."),
      O(7, "Veri sızıntısı (data leakage) nedir? İki örnek veriniz, nasıl önlenir?", "Test verisine ait bilginin eğitime karışmasıdır; başarı olduğundan yüksek görünür. <b>Örnekler:</b> (1) ölçekleyiciyi veya eksik değer doldurucuyu veriyi bölmeden önce tüm veride fit etmek, (2) hedeften türetilmiş bir özelliği girdiye koymak. <b>Önleme:</b> önce böl → yalnızca eğitimde fit → eğitim ve teste transform; test kümesini ayar için kullanma."),
      { t: "num", s: 4, q: "'Renk' sütununda 6 farklı kategori var. drop_first=True ile one-hot kodlanınca kaç sütun oluşur?", a: 5, tol: 0.01, e: "k − 1 = 5." },
      { t: "num", s: 6, q: "500 örnek 10-katlı çapraz doğrulamayla değerlendiriliyor. Her turda test parçasında kaç örnek vardır?", a: 50, tol: 0.01, e: "500 / 10 = 50 (eğitimde 450)." }
    ],
    4: [
      O(2, "En küçük kareler (OLS) yöntemini açıklayınız.", "Regresyon doğrusunu, <b>artıkların (y − ŷ) karelerinin toplamını en küçük</b> yapacak şekilde bulan yöntemdir. Basit regresyonda b₁ = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)², b₀ = ȳ − b₁x̄. Bulunan doğru her zaman (x̄, ȳ) noktasından geçer ve artıkların toplamı 0'dır."),
      { t: "num", s: 2, q: "x = [1, 2, 3], y = [2, 3, 5]. En küçük kareler eğimi b1 kaçtır?", a: 1.5, tol: 0.001, e: "x̄ = 2, ȳ = 3,333. Σ(x−x̄)(y−ȳ) = (−1)(−1,333) + 0 + (1)(1,667) = 3; Σ(x−x̄)² = 2; b1 = 3/2 = 1,5." },
      { t: "num", s: 2, q: "Aynı veri için (ȳ ≈ 3,333, x̄ = 2, b1 = 1,5) kesim b0 kaçtır? (3 ondalık)", a: 0.333, tol: 0.002, e: "b0 = 3,333 − 1,5·2 = 0,333." },
      { t: "num", s: 2, q: "Aynı modelle (ŷ = 0,333 + 1,5x) x = 4 için tahmin kaçtır? (2 ondalık)", a: 6.33, tol: 0.011, e: "0,333 + 6 = 6,333." },
      { t: "num", s: 4, q: "Gerçek y = [10, 12, 15], tahmin ŷ = [11, 12, 13]. RMSE kaçtır? (3 ondalık)", a: 1.291, tol: 0.002, e: "Hatalar 1, 0, 2 → MSE = (1 + 0 + 4)/3 = 1,667 → RMSE = √1,667 ≈ 1,291. (MAE = 1.)" },
      O(4, "R² nasıl yorumlanır? R² = 0,85 ne anlama gelir?", "R² = 1 − SSE/SST, modelin hedef değişkendeki değişimin (varyansın) ne kadarını açıkladığıdır. R² = 0,85: değişimin <b>%85'i</b> model tarafından açıklanıyor. R² = 1 mükemmel, 0 yalnızca ortalamayı tahmin etmek kadar, negatif ise ortalamadan bile kötü demektir."),
      O(4, "MAE ile RMSE arasındaki fark nedir? Hangisi aykırı değerlere daha duyarlıdır?", "MAE hataların mutlak değerlerinin ortalamasıdır: “ortalama kaç birim yanılıyoruz”. RMSE, hata karelerinin ortalamasının köküdür; kare alındığı için büyük hataları orantısız cezalandırır, bu yüzden <b>aykırı değerlere RMSE daha duyarlıdır</b>. İkisi de hedefle aynı birimdedir ve her zaman RMSE ≥ MAE."),
      O(3, "Basit ve çoklu doğrusal regresyon arasındaki fark nedir? Doğrusal regresyonun varsayımlarını yazınız.", "Basit regresyonda tek bağımsız değişken (ŷ = b₀ + b₁x), çoklu regresyonda birden fazla (ŷ = b₀ + b₁x₁ + … + bₚxₚ) vardır; çokluda her katsayı, diğerleri sabitken o değişkenin etkisidir. <b>Varsayımlar:</b> doğrusallık, hataların bağımsızlığı, sabit varyans, hataların normal dağılımı (ayrıca bağımsız değişkenler arasında güçlü çoklu doğrusal bağlantı olmamalı)."),
      O(10, "Ridge (L2) ve Lasso (L1) düzenlileştirme arasındaki fark nedir?", "İkisi de katsayıları küçülterek aşırı öğrenmeyi azaltır. <b>Lasso (L1)</b> bazı katsayıları tam <b>sıfıra</b> indirebilir, yani özellik seçimi de yapar. <b>Ridge (L2)</b> katsayıları küçültür ama sıfırlamaz.")
    ],
    5: [
      O(1, "Lojistik regresyon adında 'regresyon' geçmesine rağmen neden bir sınıflandırma yöntemidir? Doğrusal regresyon sınıflandırmada neden uygun değildir?", "Çıktısı bir <b>sınıfa ait olma olasılığıdır</b>; bu olasılık eşikle karşılaştırılarak sınıf kararı verilir. 'Regresyon' adı, log-odds'u doğrusal modellemesinden gelir. Doğrusal regresyon (−∞, +∞) çıktı ürettiği için olasılık olarak yorumlanamaz ve uçtaki örnekler doğruyu (ve eşiğin düştüğü noktayı) kaydırır. Lojistik regresyon sigmoidle çıktıyı (0, 1) aralığına sıkıştırır."),
      O(2, "Sigmoid fonksiyonunu yazınız ve özelliklerini açıklayınız.", "σ(z) = 1 / (1 + e⁻ᶻ). Çıktısı her zaman (0, 1) aralığındadır, S şeklinde ve monoton artandır. σ(0) = 0,5; z → +∞ iken 1'e, z → −∞ iken 0'a yaklaşır; σ(−z) = 1 − σ(z)."),
      { t: "num", s: 2, q: "z = −1 için σ(z) kaçtır? (e ≈ 2,718; 4 ondalık)", a: 0.2689, tol: 0.0003, e: "1/(1 + e¹) = 1/3,718 ≈ 0,2689." },
      { t: "num", s: 2, q: "Model z = −3 + 0,5x. x = 10 için P(y = 1) kaçtır? (4 ondalık)", a: 0.8808, tol: 0.0003, e: "z = −3 + 5 = 2 → σ(2) = 0,8808." },
      { t: "num", s: 3, q: "z = −3 + 0,5x modelinde karar sınırı (P = 0,5) hangi x değerindedir?", a: 6, tol: 0.001, e: "P = 0,5 ⇔ z = 0 ⇔ −3 + 0,5x = 0 ⇔ x = 6." },
      { t: "num", s: 4, q: "p = 0,75 olasılığının odds değeri kaçtır?", a: 3, tol: 0.001, e: "0,75 / 0,25 = 3." },
      O(4, "Odds ve log-odds kavramlarını açıklayınız. Lojistik regresyonda bir katsayı nasıl yorumlanır?", "<b>Odds</b> = p / (1 − p): olayın olma olasılığının olmama olasılığına oranı (p = 0,8 → 4). <b>Log-odds (logit)</b> = ln(p / (1 − p)) = z; lojistik regresyon log-odds'u doğrusal modeller. Katsayı b: x bir birim artınca log-odds b kadar, <b>odds e^b katı</b> değişir."),
      O(3, "Sınıflandırma eşiği değiştirilirse ne olur? Hangi durumda eşik düşürülür?", "Varsayılan eşik 0,5'tir. Eşik <b>düşürülürse</b> daha çok örnek pozitif sayılır: recall artar, precision genelde düşer. Eşik yükseltilirse tersi olur. Pozitifi kaçırmanın pahalı olduğu durumlarda (hastalık taraması, dolandırıcılık) eşik düşürülür.")
    ],
    6: [
      O(2, "kNN algoritmasının adımlarını yazınız.", "1) k değerini ve mesafe ölçüsünü seç. 2) Yeni örneğin tüm eğitim örneklerine uzaklığını hesapla. 3) Uzaklıkları sırala, en yakın k örneği al. 4) Sınıflandırmada çoğunluk oyu, regresyonda komşuların hedef değerlerinin ortalaması ile tahmin yap. (Öncesinde özellikleri ölçekle.)"),
      O(4, "kNN'de k değeri nasıl seçilir? Çok küçük ve çok büyük k'nın etkisi nedir?", "k bir hiperparametredir; <b>doğrulama kümesi veya çapraz doğrulama</b> ile seçilir (kaba başlangıç √n, ikili problemde tek sayı). <b>Çok küçük k</b> (k = 1): gürültüye duyarlı, karmaşık sınır → aşırı öğrenme (yüksek varyans). <b>Çok büyük k:</b> fazla düzgün sınır → yetersiz öğrenme (yüksek yanlılık); k = n ise hep çoğunluk sınıfı."),
      O(5, "kNN'de neden özellik ölçekleme yapılmalıdır?", "kNN mesafe hesaplar; ölçeği büyük olan özellik (ör. maaş 20.000–100.000) mesafeyi domine eder, küçük ölçekli özellik (yaş 20–60) etkisiz kalır. Min-Max veya z-skor ile ölçekleme her özelliğe eşit söz hakkı verir; ölçekleme sonucu en yakın komşu ve tahmin değişebilir."),
      O(5, "kNN'in avantaj ve dezavantajlarını yazınız.", "<b>Avantaj:</b> basit, eğitim aşaması yok denecek kadar hızlı, dağılım varsaymaz, esnek (doğrusal olmayan) sınırlar, hem sınıflandırma hem regresyon. <b>Dezavantaj:</b> tahmin yavaş ve bellek ister (tüm veri), ölçeklemeye, alakasız özelliklere ve boyutun lanetine duyarlı, k ve mesafe seçimi gerekir, dengesiz sınıflarda çoğunluk sınıfı kazanır."),
      O(1, "kNN neden 'tembel öğrenici' ve 'parametrik olmayan' bir yöntem olarak adlandırılır?", "<b>Tembel:</b> eğitim aşamasında model kurmaz, veriyi saklar; tüm hesap tahmin anında yapılır. <b>Parametrik olmayan:</b> veri dağılımı hakkında varsayım yapmaz ve sabit sayıda öğrenilen parametresi yoktur; tek ayarı hiperparametre k'dır."),
      { t: "mcp", s: 5, q: "Eğitim: P1(1,4)=Evet, P2(2,2)=Hayır, P3(3,5)=Evet, P4(4,0)=Hayır, P5(5,5)=Evet. Sorgu q = (3,3), Öklid, k = 3. Tahmin nedir?", o: ["Evet", "Hayır", "Beraberlik", "Belirsiz"], a: 0, e: "Mesafeler: P2 √2 ≈ 1,414 (Hayır), P3 2 (Evet), P1 √5 ≈ 2,236 (Evet), P5 √8 ≈ 2,828 (Evet), P4 √10 ≈ 3,162 (Hayır). En yakın 3: 2 Evet, 1 Hayır → Evet." },
      { t: "mcp", s: 5, q: "Aynı veride k = 1 için tahmin nedir?", o: ["Hayır", "Evet", "Beraberlik", "Belirsiz"], a: 0, e: "En yakın tek komşu P2 (1,414) → Hayır. k değişince karar değişti." },
      { t: "num", s: 3, q: "Aynı veride q = (3,3) ile P5 (5,5) arasındaki Manhattan mesafesi kaçtır?", a: 4, tol: 0.001, e: "|3 − 5| + |3 − 5| = 4." }
    ],
    7: [
      O(1, "Karışıklık matrisini çizip TP, FP, FN, TN kavramlarını açıklayınız. Tip I ve Tip II hata hangileridir?", "Satırlar gerçek, sütunlar tahmin sınıfıdır. <b>TP:</b> pozitif dedik, gerçekten pozitif. <b>TN:</b> negatif dedik, gerçekten negatif. <b>FP:</b> pozitif dedik ama negatif (yanlış alarm) → <b>Tip I hata</b>. <b>FN:</b> negatif dedik ama pozitif (kaçırma) → <b>Tip II hata</b>."),
      { t: "num", s: 2, q: "TP = 30, FP = 10, FN = 20, TN = 40. Doğruluk (accuracy) kaçtır?", a: 0.7, tol: 0.001, e: "(30 + 40)/100 = 0,70." },
      { t: "num", s: 2, q: "Aynı matris için precision kaçtır?", a: 0.75, tol: 0.001, e: "30/(30 + 10) = 0,75." },
      { t: "num", s: 2, q: "Aynı matris için recall kaçtır?", a: 0.6, tol: 0.001, e: "30/(30 + 20) = 0,60." },
      { t: "num", s: 2, q: "Aynı matris için F1 kaçtır? (4 ondalık)", a: 0.6667, tol: 0.0003, e: "2·0,75·0,6/(0,75 + 0,6) = 0,9/1,35 = 0,6667." },
      O(3, "Dengesiz veri setinde doğruluk (accuracy) neden yanıltıcıdır? Yerine hangi metrikler kullanılır?", "Çoğunluk sınıfını hep tahmin eden bir model yüksek accuracy alır ama azınlık sınıfını hiç yakalamaz. Örnek: 990 sağlam, 10 hasta; herkese “sağlam” diyen model %99 accuracy alır ama recall = 0'dır. Yerine <b>precision, recall, F1 ve AUC</b> kullanılır."),
      O(3, "Precision ile recall arasındaki fark nedir? Hangi durumda hangisi daha önemlidir?", "<b>Precision</b> = TP/(TP + FP): pozitif dediklerimizin kaçı gerçekten pozitif? <b>Recall</b> = TP/(TP + FN): gerçek pozitiflerin kaçını yakaladık? Kaçırmak pahalıysa (kanser taraması, dolandırıcılık) <b>recall</b>; yanlış alarm pahalıysa (önemli e-postanın spam'e düşmesi) <b>precision</b> önemlidir. İkisini dengelemek için F1."),
      O(4, "ROC eğrisi ve AUC nedir? AUC = 0,5 ve AUC = 1 ne anlama gelir?", "ROC eğrisi, eşik değiştirilirken <b>FPR (x ekseni)</b> ile <b>TPR / recall (y ekseni)</b> arasındaki ilişkiyi çizer. <b>AUC</b> eğrinin altındaki alandır; eşikten bağımsız bir başarı ölçüsüdür. AUC = 1 mükemmel ayrım, AUC = 0,5 rastgele tahmin (köşegen) demektir.")
    ],
    8: [
      O(1, "Bayes teoremini yazınız; önsel, olabilirlik ve sonsal kavramlarını açıklayınız.", "P(A|B) = P(B|A)·P(A) / P(B). <b>P(A):</b> önsel (kanıttan önceki inanç). <b>P(B|A):</b> olabilirlik (A doğruysa kanıtın görülme olasılığı). <b>P(A|B):</b> sonsal (kanıttan sonraki güncellenmiş inanç). <b>P(B):</b> normalleştirme sabiti; toplam olasılıkla P(B|A)P(A) + P(B|¬A)P(¬A)."),
      { t: "num", s: 3, q: "Hastalığın görülme oranı %2. Test hastaların %95'inde, sağlamların %10'unda pozitif çıkıyor. Testi pozitif çıkan birinin hasta olma olasılığı kaçtır? (3 ondalık)", a: 0.162, tol: 0.0011, e: "P(+) = 0,95·0,02 + 0,10·0,98 = 0,019 + 0,098 = 0,117; P(hasta|+) = 0,019/0,117 ≈ 0,162." },
      O(4, "Bayes ağı nedir? Koşullu olasılık tablosu (CPT) ve zincir kuralını açıklayınız.", "Değişkenleri düğüm, doğrudan etkileri yönlü ok olan <b>yönlü döngüsüz bir çizgedir (DAG)</b>. Her düğüm için ebeveynleri verildiğinde koşullu olasılık tablosu <b>P(düğüm | ebeveynler)</b> tanımlıdır (ebeveyni yoksa önsel P(düğüm)). <b>Zincir kuralı:</b> P(V₁, …, Vₙ) = ∏ P(Vᵢ | ebeveynler(Vᵢ)); bu sayede birleşik dağılım küçük tablolara bölünür ve parametre sayısı azalır."),
      O(5, "Seri, ıraksayan ve yakınsayan bağlantılarda bilginin akışını yazınız.", "<b>Seri</b> (A → B → C) ve <b>ıraksayan</b> (A ← B → C): B bilinmiyorsa A ile C bağlantılı (açık); <b>B bilinirse bloke</b>. <b>Yakınsayan</b> (A → B ← C): hiçbir şey bilinmiyorsa <b>bloke</b>; <b>B veya B'nin bir alt düğümü bilinirse açılır</b>."),
      O(6, "d-ayrışma nedir? İki değişkenin d-ayrışmış olup olmadığı nasıl belirlenir?", "İki değişken arasındaki <b>her yol</b> bloke ise değişkenler d-ayrışmıştır, yani kanıt verildiğinde koşullu bağımsızdır; en az bir yol açıksa d-bağlantılıdır. <b>Adımlar:</b> 1) iki düğüm arasındaki tüm yolları bul (okların yönünden bağımsız), 2) her yoldaki ara düğümün tipini belirle (seri / ıraksayan / yakınsayan), 3) bilinen düğümlere göre bloke olup olmadığını kontrol et, 4) tüm yollar bloke → d-ayrışmış."),
      O(5, "Açıklama etkisi (explaining away) nedir? Örnek veriniz.", "Yakınsayan bağlantıda ortak sonuç gözlendiğinde, nedenlerden birinin doğrulanması diğer nedenin olasılığını <b>düşürür</b>; yani normalde bağımsız olan nedenler bağımlı hale gelir. Örnek: boğaz ağrısı bakteriyel veya viral enfeksiyondan olabilir; ağrıyı görünce ikisinin olasılığı artar, bakteriyel enfeksiyon kesinleşince viral enfeksiyon olasılığı düşer."),
      { t: "mcp", s: 5, q: "Ağ: Yağmur → Islak çim ← Fıskiye, Islak çim → Kaygan yol. Yalnızca 'Kaygan yol' gözlendi. Yağmur ve Fıskiye d-ayrışmış mıdır?", o: ["Hayır, d-bağlantılı: Islak çim yakınsayan ve alt düğümü Kaygan yol bilindi", "Evet, d-ayrışmış: Islak çimin kendisi bilinmiyor", "Evet, çünkü aralarında doğrudan ok yok", "Hesaplanamaz"], a: 0, e: "Yakınsayan düğümü açan şey, düğümün kendisinin VEYA alt soyundan birinin bilinmesidir." },

/* ===== app.js ===== */
/* Uygulama: yönlendirme, sorular, ilerleme, deneme sınavı */
(function () {
  const app = document.getElementById("app");
  const nav = document.getElementById("nav");

  /* ---------- yardımcılar ---------- */
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("mlvize.v1")) || {}; } catch (e) { return {}; } },
    set(o) { try { localStorage.setItem("mlvize.v1", JSON.stringify(o)); } catch (e) { /* yoksay */ } }
  };
  const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const wl = id => { const w = WEEKS.find(x => x.id === id); return (w && w.label) || ("Hafta " + id); };
  const fmtNum = v => String(+(+v).toFixed(4)).replace(".", ",");

  // soruları numarala
  const ALL = [];
  WEEKS.forEach(w => w.qs.forEach((q, i) => { q.id = "w" + w.id + "-" + i; q.week = w.id; q.n = i + 1; ALL.push(q); }));
  const EX = id => (window.WEEK_EXTRAS || {})[id] || {};
  // bölüm başlıkları ve her sorunun anlatıldığı bölüm (q.sec)
  const SECT = {};
  WEEKS.forEach(w => {
    SECT[w.id] = {}; const re = /<h3>(\d+)\.\s*([\s\S]*?)<\/h3>/g; let m;
    while ((m = re.exec(w.theory))) if (!SECT[w.id][m[1]]) SECT[w.id][m[1]] = m[2].replace(/<[^>]+>/g, "");
    Object.entries(EX(w.id).checks || {}).forEach(([s, a]) => a.forEach(k => { if (w.qs[k]) w.qs[k].sec = +s; }));
    w.qs.forEach(q => { if (q.s) q.sec = q.s; });
  });
  const secLink = q => (q.sec && SECT[q.week][q.sec] ? `<a href="#/hafta/${q.week}/${q.sec}">${wl(q.week)} · ${q.sec}. ${SECT[q.week][q.sec]}</a>` : "");
  const POOL = () => ALL.filter(q => q.t !== "open"); // deneme sınavı yalnızca otomatik puanlanan sorulardan

  /* ---------- soru bileşeni ---------- */
  function makeQ(q, opts) {
    opts = opts || {};
    const exam = !!opts.exam;
    const prog = store.get();
    const el = h("div", "q" + (q.c ? " classic" : "") + (!exam && prog[q.id] === 1 ? " prev-ok" : "") + (!exam && prog[q.id] === 0 ? " prev-bad" : ""));
    const label = opts.label || ("Soru " + q.n);
    const tname = q.t === "num" ? "Hesaplama" : q.t === "tf" ? "Doğru / Yanlış" : q.t === "open" ? "Açık uçlu" : "Çoktan seçmeli";
    el.innerHTML = `<div class="qlabel">${label}${q.c ? ' <span class="chip ctag">Klasik</span>' : ""}${opts.showWeek ? ` <span class="chip">${wl(q.week)}</span>` : ""}<span class="qtype">${tname}</span></div><div class="qt">${q.q}</div>${opts.where && q.sec ? `<div class="where small">📖 Anlatıldığı yer: ${secLink(q)}</div>` : ""}`;
    const body = h("div", "qbody"), fb = h("div", "fb hidden");
    el.append(body, fb);
    let done = false, ok = null, picked = null, input = null;

    function reveal(isOk, extra) {
      if (done) return; done = true; ok = isOk;
      el.classList.remove("prev-ok", "prev-bad"); el.classList.add(isOk ? "is-ok" : "is-bad");
      fb.classList.remove("hidden");
      const headTxt = q.t === "open" ? (isOk ? "✓ Güzel, bunu biliyorsun." : "✗ Yanlışlarım'a eklendi; bölümü tekrar oku.") : (isOk ? "✓ Doğru." : "✗ Yanlış.");
      const back = !isOk && q.sec && !opts.inSection ? `<div class="reread">📖 Konuyu tekrar oku: ${secLink(q)}</div>` : "";
      fb.innerHTML = `<b>${headTxt}</b> ${extra || ""} ${q.e || ""}${back}`;
      if (!exam) { const p = store.get(); p[q.id] = isOk ? 1 : 0; store.set(p); opts.onAnswer && opts.onAnswer(); }
    }

    if (q.t === "open") {
      const ta = h("textarea"); ta.rows = 3; ta.placeholder = "Önce cevabını kendi cümlelerinle yaz (ya da kâğıda). Sonra örnek cevapla karşılaştır.";
      ta.setAttribute("aria-label", "Cevabın");
      const row = h("div", "btns"), show = h("button", "", "Örnek cevabı göster"); row.append(show);
      const model = h("div", "model hidden", `<b>Örnek cevap:</b> ${q.a}`);
      const grade = h("div", "btns hidden"), yes = h("button", "primary", "✓ Bildim"), no = h("button", "", "✗ Eksik / bilemedim");
      grade.append(h("span", "muted small selfq", "Kendi cevabını örnekle karşılaştır, dürüstçe işaretle:"), yes, no);
      body.append(ta, row, model, grade);
      show.onclick = () => { model.classList.remove("hidden"); grade.classList.remove("hidden"); row.remove(); };
      yes.onclick = () => { grade.remove(); reveal(true); };
      no.onclick = () => { grade.remove(); reveal(false); };
      el.api = { grade() { return false; } };
    } else if (q.t === "num") {
      const row = h("div", "numrow");
      input = h("input"); input.type = "text"; input.inputMode = "decimal"; input.placeholder = "Cevabın (ör. 0,85)"; input.setAttribute("aria-label", "Cevap");
      const btn = h("button", "primary", "Kontrol et");
      row.append(input, btn); body.append(row);
      const check = () => {
        const v = parseFloat(input.value.replace(",", "."));
        if (!Number.isFinite(v)) { input.focus(); return false; }
        const good = Math.abs(v - q.a) <= (q.tol != null ? q.tol : 0.01) + 1e-9;
        input.disabled = true; btn.disabled = true;
        reveal(good, good ? "" : `Doğru cevap: <b>${fmtNum(q.a)}</b>. `);
        return true;
      };
      btn.onclick = () => { if (!exam) check(); };
      input.addEventListener("keydown", e => { if (e.key === "Enter" && !exam) check(); });
      if (exam) btn.style.display = "none";
      el.api = {
        grade() { if (done) return ok; const v = parseFloat(input.value.replace(",", ".")); const good = Number.isFinite(v) && Math.abs(v - q.a) <= (q.tol != null ? q.tol : 0.01) + 1e-9; input.disabled = true; reveal(good, good ? "" : `Doğru cevap: <b>${fmtNum(q.a)}</b>. `); return good; }
      };
    } else {
      const o = q.t === "tf" ? ["Doğru", "Yanlış"] : q.o;
      const correctIdx = q.t === "tf" ? (q.a ? 0 : 1) : q.a;
      const order = q.t === "tf" ? [0, 1] : shuffle(o.map((_, i) => i));
      const list = h("div", "opts"); const btns = [];
      order.forEach((idx, pos) => {
        const b = h("button", "opt", `<span class="key">${String.fromCharCode(65 + pos)}</span><span>${o[idx]}</span>`);
        b.onclick = () => {
          if (done) return;
          if (exam) { picked = idx; btns.forEach(x => x.classList.remove("sel")); b.classList.add("sel"); return; }
          picked = idx; markAll(); reveal(idx === correctIdx);
        };
        btns.push(b); list.append(b);
      });
      function markAll() {
        btns.forEach((b, pos) => { const idx = order[pos]; b.disabled = true; if (idx === correctIdx) b.classList.add("right"); else if (idx === picked) b.classList.add("wrong"); });
      }
      body.append(list);
      el.api = { grade() { if (done) return ok; markAll(); const good = picked === correctIdx; reveal(good, picked == null ? "(Boş bıraktın.) " : ""); return good; } };
    }
    return el;
  }

  /* ---------- ilerleme ---------- */
  function weekStats(w) {
    const p = store.get(); let answered = 0, right = 0;
    w.qs.forEach(q => { if (p[q.id] != null) { answered++; if (p[q.id] === 1) right++; } });
    return { answered, right, total: w.qs.length };
  }

  /* ---------- sayfalar ---------- */
  function setActive(hash) {
    nav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === hash));
  }

  function pageHome() {
    const p = store.get(); const total = ALL.length; let ans = 0, ok = 0;
    ALL.forEach(q => { if (p[q.id] != null) { ans++; if (p[q.id] === 1) ok++; } });
    app.innerHTML = "";
    const hero = h("section", "hero", `
      <h1>Makine Öğrenmesi · Vize Hazırlık</h1>
      <p>Konu anlatımı, çözümlü örnekler, <b>${total}</b> alıştırma, etkileşimli araçlar ve deneme sınavı. Dersin ilk 7 haftası, <b>Bayes ağları</b>, <b>PDF (işbirlikçi filtreleme)</b> ve <b>Excel (kNN + Naive Bayes)</b> uygulaması tek yerde.</p>
      <div class="herobtns"><a class="btn primary" href="#/hafta/1">Hafta 1'den başla</a><a class="btn" href="#/hafta/8">Bayes ağları</a><a class="btn" href="#/hafta/9">PDF konuları</a><a class="btn" href="#/hafta/10">Excel uygulaması</a><a class="btn" href="#/kartlar">Kartlar (aralıklı tekrar)</a><a class="btn" href="#/karsilastir">Sık karıştırılanlar</a><a class="btn" href="#/sinav">Deneme sınavı</a><a class="btn" href="#/formuller">Formül kartı</a></div>
      <div class="stats hero-stats"><div><b>Çözülen</b> ${ans}/${total}</div><div><b>Doğru</b> ${ok}</div><div><b>Başarı</b> ${ans ? Math.round(ok / ans * 100) + "%" : "—"}</div>${ans - ok ? `<div><a href="#/yanlislar"><b>Yanlışlarım</b> ${ans - ok} → tekrar çöz</a></div>` : ""}</div>`);
    app.append(hero);
    const grid = h("section", "grid");
    WEEKS.forEach(w => {
      const s = weekStats(w), pct = Math.round(s.answered / s.total * 100);
      const card = h("a", "card", `<div class="wk">${wl(w.id)}</div><h3>${w.title}</h3><p class="muted">${w.sub}</p>
        <div class="bar"><i style="width:${pct}%"></i></div><div class="muted small">${s.answered}/${s.total} soru çözüldü · ${s.right} doğru</div>`);
      card.href = "#/hafta/" + w.id; grid.append(card);
    });
    app.append(h("h2", "sec", "Nasıl çalışmalı?"), h("div", "howto", `
      <ol>
        <li>Her haftaya <b>“Bu haftanın özü”</b> kutusuyla başla, sonra konu anlatımını şemalara bakarak oku. Çözümlü örnekleri kâğıtta kendin yeniden çöz.</li>
        <li>Her bölümün sonundaki <b>“Kendini yokla”</b> sorularını hemen çöz; takılırsan bölümü bir daha oku.</li>
        <li>Bölümlerin içindeki <b>“Dene”</b> araçlarıyla (kNN, regresyon, sigmoid, metrikler...) sürgüleri oynatıp sezgi kazan. Hepsi <b>Araçlar</b> sayfasında da toplu duruyor.</li>
        <li>Çözümlü örnekler <b>adım adım</b> açılır: her adımı açmadan önce kendin tahmin et.</li>
        <li>Haftanın sonundaki <b>🎓 Klasik vize soruları</b>nı çöz: “tanımlayınız, karşılaştırınız, açıklayınız” tipi sorularda önce kendi cevabını yaz, sonra örnek cevapla karşılaştır.</li>
        <li>Sayfa sonundaki <b>alıştırmaları</b> çöz. Yanlış yaptıkların <b>Yanlışlarım</b> sayfasında birikir; oradan tekrar çöz.</li>
        <li>Her gün birkaç dakika <b>Kartlar</b>'ı çevir (aralıklı tekrar); karıştırdığın kavramlar için <b>Sık karıştırılanlar</b> sayfasındaki karar ağaçlarını kullan.</li>
        <li>Vizeye yakın <b>deneme sınavı</b> ile eksik haftaları bul (sonuç ekranı hafta bazında başarını gösterir).</li>

  /* konu anlatımına şema, araç ve "Kendini yokla" sorularını yerleştir */
  function enhanceTheory(th, w, X, onAnswer) {
    const heads = [...th.children].filter(e => e.tagName === "H3"), secs = {};

    const inSec = (s, el) => { for (let e = s.hd.nextElementSibling; e && e !== s.next; e = e.nextElementSibling) if (e === el) return true; return false; };

    // sezgi kutusu: giriş cümlesinden hemen sonra (şemadan önce)
